<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unfallkarte Deutschland</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f4f4;
}

#map {
  width: 100%;
  height: 100vh;
}

#controls {
  position: absolute;
  z-index: 1000;
  top: 15px;
  left: 15px;
  background: rgba(255,255,255,.96);
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}

#controls button {
  border: 1px solid #aaa;
  background: #fff;
  padding: 8px 13px;
  margin: 2px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}

#controls button.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

#status {
  margin-top: 7px;
  font-size: 12px;
  color: #555;
}

.legend {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.7;
}

.legend-row {
  display: flex;
  align-items: center;
  height: 22px;
}

.legend-warning {
  width: 22px;
  height: 22px;
  margin-right: 5px;
  flex-shrink: 0;
}

.accident-popup {
  font-size: 13px;
  line-height: 1.45;
  min-width: 220px;
}

.accident-popup b.title {
  font-size: 15px;
}

.leaflet-div-icon {
  background: transparent !important;
  border: 0 !important;
}
</style>
</head>

<body>

<div id="controls">

  <button id="currentBtn" class="active">
    Aktuell
  </button>

  <button id="historyBtn">
    Letzte 24 Stunden
  </button>

  <div class="legend">

    <div class="legend-row">

      <svg class="legend-warning"
           viewBox="0 0 46 46"
           xmlns="http://www.w3.org/2000/svg">

        <path
          d="M23 2 L44 40 Q46 44 41 44 H5 Q0 44 2 40 Z"
          fill="#d32f2f"
          stroke="white"
          stroke-width="3"
          stroke-linejoin="round"/>

        <rect
          x="20.5"
          y="13"
          width="5"
          height="17"
          rx="2.5"
          fill="white"/>

        <circle
          cx="23"
          cy="36"
          r="2.8"
          fill="white"/>

      </svg>

      aktuelle Meldung

    </div>


    <div class="legend-row">

      <svg class="legend-warning"
           viewBox="0 0 46 46"
           xmlns="http://www.w3.org/2000/svg">

        <path
          d="M23 2 L44 40 Q46 44 41 44 H5 Q0 44 2 40 Z"
          fill="#777777"
          stroke="white"
          stroke-width="3"
          stroke-linejoin="round"/>

        <rect
          x="20.5"
          y="13"
          width="5"
          height="17"
          rx="2.5"
          fill="white"/>

        <circle
          cx="23"
          cy="36"
          r="2.8"
          fill="white"/>

      </svg>

      beendete Meldung

    </div>

  </div>

  <div id="status">
    Lade Daten …
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";


/*
 * ============================================================
 * Cloudflare Worker / API
 * ============================================================
 */

const API_URL =
  "https://accde-api.r73d.workers.dev/";


/*
 * ============================================================
 * Karte
 * ============================================================
 */

const map = L.map("map", {

  zoomControl: true,

  preferCanvas: false

}).setView(
  [51.1657, 10.4515],
  6
);


L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Esri"
  }
).addTo(map);


/*
 * Deutschland-Ausschnitt
 *
 * Keine Deutschland-Maske.
 */

const germanyBounds = L.latLngBounds(
  [47.15, 5.80],
  [55.15, 15.15]
);

map.fitBounds(germanyBounds);


/*
 * ============================================================
 * Globale Variablen
 * ============================================================
 */

let markerLayer =
  L.layerGroup().addTo(map);

let allAccidents = [];

let mode = "current";


/*
 * ============================================================
 * Hilfsfunktionen
 * ============================================================
 */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


function firstValue(
  obj,
  names
) {

  for (
    const name of names
  ) {

    if (
      obj &&
      obj[name] !== undefined &&
      obj[name] !== null &&
      obj[name] !== ""
    ) {

      return obj[name];
    }
  }

  return null;
}


function toNumber(value) {

  if (
    typeof value === "number" &&
    Number.isFinite(value)
  ) {

    return value;
  }


  if (
    typeof value === "string"
  ) {

    const n =
      Number(
        value.replace(",", ".")
      );


    if (
      Number.isFinite(n)
    ) {

      return n;
    }
  }


  return null;
}


function parseDate(value) {

  if (!value) {
    return null;
  }


  const d =
    new Date(value);


  if (
    !Number.isNaN(
      d.getTime()
    )
  ) {

    return d;
  }


  return null;
}


function formatDate(value) {

  const d =
    parseDate(value);


  if (!d) {

    return value
      ? escapeHtml(value)
      : "nicht angegeben";
  }


  return d.toLocaleString(
    "de-DE",
    {
      dateStyle: "short",
      timeStyle: "medium"
    }
  );
}


/*
 * ============================================================
 * Anfang / Ende
 * ============================================================
 */

function getEndedAt(a) {

  return firstValue(
    a,
    [

      "endedAt",

      "ended_at",

      "endAt",

      "end_at",

      "finishedAt",

      "finished_at",

      "removedAt",

      "removed_at"

    ]
  );
}


function getCreatedAt(a) {

  return firstValue(
    a,
    [

      "createdAt",

      "created_at",

      "firstSeen",

      "first_seen",

      "timestamp",

      "time"

    ]
  );
}


/*
 * ============================================================
 * Status
 * ============================================================
 */

function isEnded(a) {

  const ended =
    getEndedAt(a);


  if (
    ended
  ) {

    return true;
  }


  const status =
    firstValue(
      a,
      [
        "status",
        "state"
      ]
    );


  if (
    status
  ) {

    const s =
      String(
        status
      ).toLowerCase();


    if (
      [
        "ended",
        "finished",
        "closed",
        "inactive",
        "removed",
        "beendet"
      ].includes(s)
    ) {

      return true;
    }
  }


  return false;
}


/*
 * ============================================================
 * API-Antwort
 * ============================================================
 */

function normalizeResponse(data) {

  /*
   * Direktes Array
   */

  if (
    Array.isArray(data)
  ) {

    return data;
  }


  /*
   * GeoJSON
   */

  if (
    data &&
    Array.isArray(
      data.features
    )
  ) {

    return data.features.map(
      f => {

        const p =
          f.properties || {};


        const c =
          f.geometry &&
          f.geometry.coordinates;


        return {

          ...p,

          longitude:
            firstValue(
              p,
              [
                "longitude",
                "lon",
                "lng"
              ]
            ) ??
            (
              c
                ? c[0]
                : null
            ),

          latitude:
            firstValue(
              p,
              [
                "latitude",
                "lat"
              ]
            ) ??
            (
              c
                ? c[1]
                : null
            )
        };

      }
    );
  }


  /*
   * {data:[...]}
   */

  if (
    data &&
    Array.isArray(
      data.data
    )
  ) {

    return normalizeResponse(
      data.data
    );
  }


  /*
   * {results:[...]}
   */

  if (
    data &&
    Array.isArray(
      data.results
    )
  ) {

    return normalizeResponse(
      data.results
    );
  }


  /*
   * {accidents:[...]}
   */

  if (
    data &&
    Array.isArray(
      data.accidents
    )
  ) {

    return normalizeResponse(
      data.accidents
    );
  }


  return [];
}


/*
 * ============================================================
 * Koordinaten
 * ============================================================
 */

function getCoordinates(a) {

  let lat =
    firstValue(
      a,
      [
        "latitude",
        "lat",
        "Latitude",
        "LATITUDE"
      ]
    );


  let lon =
    firstValue(
      a,
      [
        "longitude",
        "lon",
        "lng",
        "Longitude",
        "LONGITUDE"
      ]
    );


  /*
   * GeoJSON-Fallback
   */

  if (
    (
      lat === null ||
      lon === null
    ) &&
    a.geometry
  ) {

    const c =
      a.geometry.coordinates;


    if (
      Array.isArray(c) &&
      c.length >= 2
    ) {

      lon = c[0];

      lat = c[1];
    }
  }


  lat =
    toNumber(lat);

  lon =
    toNumber(lon);


  if (
    lat === null ||
    lon === null
  ) {

    return null;
  }


  /*
   * Deutschland / unmittelbare Umgebung
   */

  if (
    lat < 47 ||
    lat > 56 ||
    lon < 5 ||
    lon > 16
  ) {

    return null;
  }


  /*
   * WICHTIG:
   *
   * Leaflet erwartet:
   * [latitude, longitude]
   */

  return [
    lat,
    lon
  ];
}


/*
 * ============================================================
 * Warn-Dreieck
 *
 * AKTUELL = ROT
 * BEENDET  = GRAU
 *
 * Deutlich größer als vorher.
 * ============================================================
 */

function createWarningIcon(
  ended
) {

  const color =
    ended
      ? "#777777"
      : "#d32f2f";


  return L.divIcon({

    className:
      "accident-warning-icon",

    iconSize:
      [46, 46],

    /*
     * Spitze des Dreiecks
     * liegt genau auf der Koordinate.
     */

    iconAnchor:
      [23, 44],

    popupAnchor:
      [0, -40],

    html: `

      <div
        style="
          width:46px;
          height:46px;
          position:relative;
          filter:
            drop-shadow(
              0 2px 2px
              rgba(0,0,0,.5)
            );
        "
      >

        <svg
          width="46"
          height="46"
          viewBox="0 0 46 46"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="
              M23 2
              L44 40
              Q46 44 41 44
              H5
              Q0 44 2 40
              Z
            "

            fill="${color}"

            stroke="white"

            stroke-width="3"

            stroke-linejoin="round"
          />

          <rect
            x="20.5"
            y="13"
            width="5"
            height="17"
            rx="2.5"
            fill="white"
          />

          <circle
            cx="23"
            cy="36"
            r="2.8"
            fill="white"
          />

        </svg>

      </div>

    `
  });
}


/*
 * ============================================================
 * Popup
 * ============================================================
 */

function createPopup(
  a,
  ended
) {

  const city =
    firstValue(
      a,
      [
        "city",
        "ort",
        "town",
        "location"
      ]
    ) ||
    "unbekannt";


  const street =
    firstValue(
      a,
      [
        "street",
        "strasse",
        "straße"
      ]
    ) ||
    "unbekannt";


  const created =
    getCreatedAt(a);


  const endedAt =
    getEndedAt(a);


  const reliability =
    firstValue(
      a,
      [
        "reliability",
        "zuverlaessigkeit",
        "zuverlässigkeit"
      ]
    );


  const confirmed =
    firstValue(
      a,
      [
        "confirmedAt",
        "confirmed_at",
        "bestätigt",
        "bestaetigt"
      ]
    );


  let html =

    '<div class="accident-popup">' +

      '<b class="title">' +

        (
          ended

            ? "⚠ Beendete Unfallmeldung"

            : "⚠ Aktuelle Unfallmeldung"
        ) +

      '</b>' +

      '<br><br>' +

      '<b>Ort:</b> ' +

      escapeHtml(city) +

      '<br>' +

      '<b>Straße:</b> ' +

      escapeHtml(street);


  /*
   * BEENDET
   *
   * Nur Anfang und Ende.
   */

  if (
    ended
  ) {

    html +=

      '<br>' +

      '<b>Anfang:</b> ' +

      formatDate(
        created
      ) +

      '<br>' +

      '<b>Ende:</b> ' +

      formatDate(
        endedAt
      );

  }


  /*
   * AKTUELL
   */

  else {

    html +=

      '<br>' +

      '<b>Meldung:</b> ' +

      formatDate(
        created
      );


    if (
      confirmed
    ) {

      html +=

        '<br>' +

        '<b>Bestätigt:</b> ' +

        formatDate(
          confirmed
        );
    }


    if (
      reliability
    ) {

      html +=

        '<br>' +

        '<b>Zuverlässigkeit:</b> ' +

        escapeHtml(
          reliability
        );
    }
  }


  html +=
    '</div>';


  return html;
}


/*
 * ============================================================
 * Marker zeichnen
 * ============================================================
 */

function renderMarkers() {

  markerLayer.clearLayers();

  let shown = 0;


  for (
    const accident of allAccidents
  ) {

    const ended =
      isEnded(
        accident
      );


    /*
     * AKTUELL:
     * beendete Meldungen ausblenden.
     */

    if (
      mode === "current" &&
      ended
    ) {

      continue;
    }


    /*
     * LETZTE 24 STUNDEN
     */

    if (
      mode === "history"
    ) {

      const reference =
        getEndedAt(accident) ||
        getCreatedAt(accident);


      const d =
        parseDate(
          reference
        );


      if (
        d
      ) {

        const age =
          Date.now() -
          d.getTime();


        const start =
          parseDate(
            getCreatedAt(
              accident
            )
          );


        const relevant =

          (
            ended &&
            age <=
              24 *
              60 *
              60 *
              1000
          )

          ||

          (
            !ended &&
            start &&
            (
              Date.now() -
              start.getTime()
            ) <=
              24 *
              60 *
              60 *
              1000
          );


        if (
          !relevant
        ) {

          continue;
        }
      }
    }


    /*
     * Koordinaten
     */

    const coords =
      getCoordinates(
        accident
      );


    if (
      !coords
    ) {

      continue;
    }


    /*
     * Marker erzeugen
     *
     * Hier wird 'ended' direkt an
     * createWarningIcon übergeben.
     */

    const marker =
      L.marker(
        coords,
        {

          icon:
            createWarningIcon(
              ended
            ),

          keyboard:
            false

        }
      );


    /*
     * Popup
     */

    marker.bindPopup(
      createPopup(
        accident,
        ended
      )
    );


    marker.addTo(
      markerLayer
    );


    shown++;
  }


  /*
   * Status
   */

  document.getElementById(
    "status"
  ).textContent =

    shown +

    " Meldung" +

    (
      shown === 1
        ? ""
        : "en"
    ) +

    " angezeigt";


  map.invalidateSize(
    false
  );
}


/*
 * ============================================================
 * Daten laden
 * ============================================================
 */

async function loadData() {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "Lade Daten …";


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:
            "GET",

          cache:
            "no-store",

          headers:
            {
              "Accept":
                "application/json"
            }

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    allAccidents =
      normalizeResponse(
        data
      );


    console.log(
      "Unfalldaten:",
      allAccidents
    );


    console.log(
      "Anzahl Datensätze:",
      allAccidents.length
    );


    renderMarkers();


  }

  catch (
    error
  ) {

    console.error(
      "Fehler beim Laden der Unfalldaten:",
      error
    );


    status.textContent =
      "Fehler beim Laden der Daten: " +
      error.message;
  }
}


/*
 * ============================================================
 * Button AKTUELL
 * ============================================================
 */

document
  .getElementById(
    "currentBtn"
  )
  .addEventListener(
    "click",
    function() {

      mode =
        "current";


      this.classList.add(
        "active"
      );


      document
        .getElementById(
          "historyBtn"
        )
        .classList.remove(
          "active"
        );


      renderMarkers();

    }
  );


/*
 * ============================================================
 * Button LETZTE 24 STUNDEN
 * ============================================================
 */

document
  .getElementById(
    "historyBtn"
  )
  .addEventListener(
    "click",
    function() {

      mode =
        "history";


      this.classList.add(
        "active"
      );


      document
        .getElementById(
          "currentBtn"
        )
        .classList.remove(
          "active"
        );


      renderMarkers();

    }
  );


/*
 * ============================================================
 * Zoom
 *
 * Keine Koordinaten verändern.
 * Leaflet berechnet die Markerposition.
 * ============================================================
 */

map.on(
  "zoomend",
  function() {

    markerLayer.eachLayer(
      marker => {

        if (
          marker.getElement()
        ) {

          marker.update();
        }

      }
    );

  }
);


/*
 * ============================================================
 * Erste Abfrage
 * ============================================================
 */

loadData();


/*
 * ============================================================
 * Alle 5 Minuten aktualisieren
 * ============================================================
 */

setInterval(
  loadData,
  5 * 60 * 1000
);

</script>

</body>
</html>
