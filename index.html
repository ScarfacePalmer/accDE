<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unfallkarte Deutschland</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f4f4;
}

#map {
  width: 100%;
  height: 100vh;
}

#controls {
  position: absolute;
  z-index: 1000;
  top: 15px;
  left: 15px;
  background: rgba(255,255,255,.96);
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25);
}

#controls button {
  border: 1px solid #aaa;
  background: #fff;
  padding: 8px 13px;
  margin: 2px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}

#controls button.active {
  background: #333;
  color: #fff;
  border-color: #333;
}

#status {
  margin-top: 7px;
  font-size: 12px;
  color: #555;
}

.legend {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.7;
}

.legend span {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: -1px;
}

.accident-popup {
  font-size: 13px;
  line-height: 1.45;
  min-width: 220px;
}

.accident-popup b.title {
  font-size: 15px;
}

.leaflet-div-icon {
  background: transparent !important;
  border: 0 !important;
}
</style>
</head>

<body>

<div id="controls">

  <button id="currentBtn" class="active">
    Aktuell
  </button>

  <button id="historyBtn">
    Letzte 24 Stunden
  </button>

  <div class="legend">
    <div>
      <span style="background:#d32f2f"></span>
      aktuelle Meldung
    </div>

    <div>
      <span style="background:#777"></span>
      beendete Meldung
    </div>
  </div>

  <div id="status">
    Lade Daten …
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

/*
 * Cloudflare Worker / API
 */
const API_URL =
  "https://accde-api.r73d.workers.dev/";


/*
 * Karte
 */
const map = L.map("map", {
  zoomControl: true,
  preferCanvas: false
}).setView([51.1657, 10.4515], 6);


L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Esri"
  }
).addTo(map);


/*
 * Deutschland-Zentrum / Ausschnitt
 *
 * Es wird absichtlich KEINE Deutschland-Maske geladen.
 */
const germanyBounds = L.latLngBounds(
  [47.15, 5.80],
  [55.15, 15.15]
);

map.fitBounds(germanyBounds);


/*
 * Marker-Layer
 */
let markerLayer = L.layerGroup().addTo(map);

let allAccidents = [];

let mode = "current";


/*
 * Hilfsfunktionen
 */
function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function firstValue(obj, names) {

  for (const name of names) {

    if (
      obj &&
      obj[name] !== undefined &&
      obj[name] !== null &&
      obj[name] !== ""
    ) {
      return obj[name];
    }
  }

  return null;
}


function toNumber(value) {

  if (
    typeof value === "number" &&
    Number.isFinite(value)
  ) {
    return value;
  }

  if (typeof value === "string") {

    const n = Number(
      value.replace(",", ".")
    );

    if (Number.isFinite(n)) {
      return n;
    }
  }

  return null;
}


function parseDate(value) {

  if (!value) {
    return null;
  }

  const d = new Date(value);

  if (!Number.isNaN(d.getTime())) {
    return d;
  }

  return null;
}


function formatDate(value) {

  const d = parseDate(value);

  if (!d) {
    return value
      ? escapeHtml(value)
      : "nicht angegeben";
  }

  return d.toLocaleString("de-DE", {
    dateStyle: "short",
    timeStyle: "medium"
  });
}


/*
 * Ende einer Meldung ermitteln
 */
function getEndedAt(a) {

  return firstValue(a, [

    "endedAt",
    "ended_at",

    "endAt",
    "end_at",

    "finishedAt",
    "finished_at",

    "removedAt",
    "removed_at"

  ]);
}


/*
 * Beginn einer Meldung ermitteln
 */
function getCreatedAt(a) {

  return firstValue(a, [

    "createdAt",
    "created_at",

    "firstSeen",
    "first_seen",

    "timestamp",
    "time"

  ]);
}


/*
 * Prüfen, ob Meldung beendet wurde
 */
function isEnded(a) {

  const ended = getEndedAt(a);

  if (ended) {
    return true;
  }


  /*
   * Falls der Worker ein Statusfeld liefert
   */
  const status = firstValue(a, [
    "status",
    "state"
  ]);

  if (status) {

    const s =
      String(status).toLowerCase();

    if (
      [
        "ended",
        "finished",
        "closed",
        "inactive",
        "removed",
        "beendet"
      ].includes(s)
    ) {
      return true;
    }
  }

  return false;
}


/*
 * API-Antwort vereinheitlichen
 */
function normalizeResponse(data) {

  /*
   * API liefert direkt ein Array
   */
  if (Array.isArray(data)) {
    return data;
  }


  /*
   * GeoJSON
   */
  if (
    data &&
    Array.isArray(data.features)
  ) {

    return data.features.map(f => {

      const p =
        f.properties || {};

      const c =
        f.geometry &&
        f.geometry.coordinates;

      return {

        ...p,

        longitude:
          firstValue(
            p,
            [
              "longitude",
              "lon",
              "lng"
            ]
          ) ??
          (c ? c[0] : null),

        latitude:
          firstValue(
            p,
            [
              "latitude",
              "lat"
            ]
          ) ??
          (c ? c[1] : null)
      };

    });
  }


  /*
   * { data: [...] }
   */
  if (
    data &&
    Array.isArray(data.data)
  ) {

    return normalizeResponse(
      data.data
    );
  }


  /*
   * { results: [...] }
   */
  if (
    data &&
    Array.isArray(data.results)
  ) {

    return normalizeResponse(
      data.results
    );
  }


  /*
   * { accidents: [...] }
   */
  if (
    data &&
    Array.isArray(data.accidents)
  ) {

    return normalizeResponse(
      data.accidents
    );
  }


  return [];
}


/*
 * Koordinaten aus Datensatz lesen
 */
function getCoordinates(a) {

  let lat =
    firstValue(
      a,
      [
        "latitude",
        "lat",
        "Latitude",
        "LATITUDE"
      ]
    );


  let lon =
    firstValue(
      a,
      [
        "longitude",
        "lon",
        "lng",
        "Longitude",
        "LONGITUDE"
      ]
    );


  /*
   * Falls geometry vorhanden ist
   */
  if (
    (lat === null || lon === null) &&
    a.geometry
  ) {

    const c =
      a.geometry.coordinates;

    if (
      Array.isArray(c) &&
      c.length >= 2
    ) {

      lon = c[0];
      lat = c[1];
    }
  }


  lat = toNumber(lat);
  lon = toNumber(lon);


  if (
    lat === null ||
    lon === null
  ) {
    return null;
  }


  /*
   * Nur Deutschland
   */
  if (
    lat < 47 ||
    lat > 56 ||
    lon < 5 ||
    lon > 16
  ) {
    return null;
  }


  return [
    lat,
    lon
  ];
}


/*
 * Warn-Dreieck
 *
 * WICHTIG:
 * Keine CSS-Transformation auf dem
 * eigentlichen Marker.
 *
 * Dadurch sollte sich der Marker beim
 * Zoomen nicht mehr verschieben.
 */
function createWarningIcon(ended) {

  const background =
    ended
      ? "#777"
      : "#d32f2f";


  return L.divIcon({

    className:
      "accident-warning-icon",

    iconSize:
      [30, 30],

    iconAnchor:
      [15, 30],

    popupAnchor:
      [0, -28],

    html:

      '<div style="' +

        'width:0;' +
        'height:0;' +

        'border-left:15px solid transparent;' +
        'border-right:15px solid transparent;' +

        'border-bottom:27px solid ' +
        background +
        ';' +

        'position:relative;' +

        'filter:drop-shadow(' +
          '0 1px 2px rgba(0,0,0,.55)' +
        ');' +

      '">' +

        '<span style="' +

          'position:absolute;' +

          'left:-15px;' +
          'top:5px;' +

          'width:30px;' +

          'text-align:center;' +

          'color:white;' +

          'font:bold 17px Arial;' +

        '">' +

          '!' +

        '</span>' +

      '</div>'
  });
}


/*
 * Popup erzeugen
 */
function createPopup(a, ended) {

  const city =
    firstValue(
      a,
      [
        "city",
        "ort",
        "town",
        "location"
      ]
    ) ||
    "unbekannt";


  const street =
    firstValue(
      a,
      [
        "street",
        "strasse",
        "straße"
      ]
    ) ||
    "unbekannt";


  const created =
    getCreatedAt(a);


  const endedAt =
    getEndedAt(a);


  const reliability =
    firstValue(
      a,
      [
        "reliability",
        "zuverlaessigkeit",
        "zuverlässigkeit"
      ]
    );


  const confirmed =
    firstValue(
      a,
      [
        "confirmedAt",
        "confirmed_at",
        "bestätigt",
        "bestaetigt"
      ]
    );


  let html =

    '<div class="accident-popup">' +

      '<b class="title">' +

        (
          ended
            ? "⚠ Beendete Unfallmeldung"
            : "⚠ Aktuelle Unfallmeldung"
        ) +

      '</b>' +

      '<br><br>' +

      '<b>Ort:</b> ' +
      escapeHtml(city) +

      '<br>' +

      '<b>Straße:</b> ' +
      escapeHtml(street);


  /*
   * Bei beendeten Meldungen:
   *
   * NUR Anfang und Ende
   */
  if (ended) {

    html +=

      '<br>' +

      '<b>Anfang:</b> ' +
      formatDate(created) +

      '<br>' +

      '<b>Ende:</b> ' +
      formatDate(endedAt);

  } else {

    /*
     * Aktuelle Meldung
     */
    html +=

      '<br>' +

      '<b>Meldung:</b> ' +
      formatDate(created);


    if (confirmed) {

      html +=

        '<br>' +

        '<b>Bestätigt:</b> ' +

        formatDate(
          confirmed
        );
    }


    if (reliability) {

      html +=

        '<br>' +

        '<b>Zuverlässigkeit:</b> ' +

        escapeHtml(
          reliability
        );
    }
  }


  html +=
    '</div>';


  return html;
}


/*
 * Marker zeichnen
 */
function renderMarkers() {

  markerLayer.clearLayers();

  let shown = 0;


  for (
    const accident of allAccidents
  ) {

    const ended =
      isEnded(accident);


    /*
     * AKTUELL:
     * nur aktive Meldungen
     */
    if (
      mode === "current" &&
      ended
    ) {
      continue;
    }


    /*
     * LETZTE 24 STUNDEN
     */
    if (mode === "history") {

      const reference =
        getEndedAt(accident) ||
        getCreatedAt(accident);


      const d =
        parseDate(reference);


      if (d) {

        const age =
          Date.now() -
          d.getTime();


        const start =
          parseDate(
            getCreatedAt(accident)
          );


        const relevant =

          (
            ended &&
            age <=
              24 * 60 * 60 * 1000
          )

          ||

          (
            !ended &&
            start &&
            (
              Date.now() -
              start.getTime()
            ) <=
              24 * 60 * 60 * 1000
          );


        if (!relevant) {
          continue;
        }
      }
    }


    /*
     * Koordinaten
     */
    const coords =
      getCoordinates(accident);


    if (!coords) {
      continue;
    }


    /*
     * Leaflet Marker
     */
    const marker =
      L.marker(
        coords,
        {
          icon:
            createWarningIcon(
              ended
            ),

          keyboard: false
        }
      );


    /*
     * Popup
     */
    marker.bindPopup(
      createPopup(
        accident,
        ended
      )
    );


    marker.addTo(
      markerLayer
    );


    shown++;
  }


  /*
   * Status
   */
  document.getElementById(
    "status"
  ).textContent =

    shown +
    " Meldung" +
    (shown === 1 ? "" : "en") +
    " angezeigt";


  /*
   * Leaflet neu berechnen lassen
   */
  map.invalidateSize(false);
}


/*
 * Daten laden
 */
async function loadData() {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "Lade Daten …";


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "GET",

          cache: "no-store",

          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    allAccidents =
      normalizeResponse(data);


    console.log(
      "Unfalldaten:",
      allAccidents
    );


    console.log(
      "Anzahl Datensätze:",
      allAccidents.length
    );


    renderMarkers();


  } catch (error) {

    console.error(
      "Fehler beim Laden der Unfalldaten:",
      error
    );


    status.textContent =
      "Fehler beim Laden der Daten: " +
      error.message;
  }
}


/*
 * Button: AKTUELL
 */
document
  .getElementById("currentBtn")
  .addEventListener(
    "click",
    function() {

      mode = "current";


      this.classList.add(
        "active"
      );


      document
        .getElementById(
          "historyBtn"
        )
        .classList.remove(
          "active"
        );


      renderMarkers();
    }
  );


/*
 * Button: LETZTE 24 STUNDEN
 */
document
  .getElementById("historyBtn")
  .addEventListener(
    "click",
    function() {

      mode = "history";


      this.classList.add(
        "active"
      );


      document
        .getElementById(
          "currentBtn"
        )
        .classList.remove(
          "active"
        );


      renderMarkers();
    }
  );


/*
 * Bei Zoom:
 *
 * KEINE Koordinaten verändern.
 * Leaflet berechnet die Position selbst.
 */
map.on(
  "zoomend",
  function() {

    markerLayer.eachLayer(
      marker => {

        if (
          marker.getElement()
        ) {

          marker.update();
        }
      }
    );
  }
);


/*
 * Erste Abfrage
 */
loadData();


/*
 * Alle 5 Minuten aktualisieren
 */
setInterval(
  loadData,
  5 * 60 * 1000
);

</script>

</body>
</html>
