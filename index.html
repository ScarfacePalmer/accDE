<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verkehrslage – Unfälle Deutschland</title>

    <link
        href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }


        /* =========================================
           BUTTONS
           ========================================= */

        .controls {
            position: absolute;
            z-index: 2000;

            top: 10px;
            left: 10px;

            background: white;

            padding: 5px;

            border-radius: 7px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.3);

            display: flex;
            gap: 5px;
        }


        .controls button {
            border: none;

            padding: 9px 14px;

            border-radius: 5px;

            background: #eeeeee;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;
        }


        .controls button:hover {
            background: #dddddd;
        }


        .controls button.active {
            background: #1976d2;
            color: white;
        }


        /* =========================================
           TITEL
           ========================================= */

        .title-box {
            position: absolute;
            z-index: 2000;

            top: 10px;
            left: 50%;

            transform: translateX(-50%);

            background: white;

            padding: 8px 14px;

            border-radius: 6px;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.3);

            font-weight: bold;
        }


        /* =========================================
           STATUS
           ========================================= */

        .status-box {
            position: absolute;
            z-index: 2000;

            bottom: 10px;
            left: 10px;

            background: white;

            padding: 7px 10px;

            border-radius: 5px;

            box-shadow:
                0 2px 6px rgba(0,0,0,0.25);

            font-size: 12px;
        }


        /* =========================================
           WARNDREIECK
           
           Die UNTERE MITTE des Elements ist die
           eigentliche Kartenposition.
           ========================================= */

        .accident-marker {
            position: relative;

            width: 32px;
            height: 30px;

            cursor: pointer;

            transform: translateY(0);

            filter:
                drop-shadow(
                    0 2px 3px rgba(0,0,0,0.6)
                );
        }


        .accident-marker::before {
            content: "";

            position: absolute;

            left: 1px;
            top: 0;

            width: 0;
            height: 0;

            border-left:
                15px solid transparent;

            border-right:
                15px solid transparent;

            border-bottom:
                28px solid var(--marker-color);
        }


        .accident-marker::after {
            content: "!";

            position: absolute;

            left: 0;
            top: 3px;

            width: 32px;

            text-align: center;

            color: white;

            font-weight: bold;

            font-size: 18px;

            line-height: 22px;

            text-shadow:
                0 1px 1px rgba(0,0,0,0.5);
        }


        /* Aktueller Unfall */

        .accident-current {
            --marker-color: #d71920;
        }


        /* Beendeter Unfall */

        .accident-ended {
            --marker-color: #777777;
        }


        /* =========================================
           POPUP
           ========================================= */

        .maplibregl-popup-content {
            font-size: 13px;

            line-height: 1.45;

            padding: 10px 12px;
        }


        .tooltip-title {
            font-size: 15px;

            font-weight: bold;

            margin-bottom: 4px;
        }


        .maplibregl-popup {
            z-index: 3000;
        }

    </style>
</head>


<body>


<!-- =========================================
     BUTTONS
     ========================================= -->

<div class="controls">

    <button
        id="currentButton"
        class="active"
    >
        AKTUELL
    </button>


    <button
        id="dayButton"
    >
        LETZTE 24 H
    </button>

</div>


<!-- =========================================
     TITEL
     ========================================= -->

<div class="title-box">
    🚨 Unfallmeldungen Deutschland
</div>


<!-- =========================================
     KARTE
     ========================================= -->

<div id="map"></div>


<!-- =========================================
     STATUS
     ========================================= -->

<div
    class="status-box"
    id="status"
>
    Lade Unfallmeldungen …
</div>


<script
    src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js">
</script>


<script>


// ==========================================================
// KONFIGURATION
// ==========================================================

const API_URL =
    "https://accde-api.r73d.workers.dev/api/accidents";


const GERMANY_GEOJSON =
    "https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/1_deutschland/1_deutschland_low.geo.json";


let currentMode = "current";


let accidentMarkers = [];


// ==========================================================
// KARTE
// ==========================================================

const map = new maplibregl.Map({

    container: "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center: [
        10.4515,
        51.1657
    ],

    zoom: 5.5,

    minZoom: 4,

    maxZoom: 18,

    attributionControl: true
});


// Navigation oben rechts

map.addControl(

    new maplibregl.NavigationControl(),

    "top-right"

);


// ==========================================================
// DEUTSCHLAND-MASKE
// ==========================================================

async function createGermanyMask() {

    try {

        const response =
            await fetch(
                GERMANY_GEOJSON
            );


        if (!response.ok) {

            throw new Error(
                "Deutschland-GeoJSON konnte nicht geladen werden."
            );
        }


        const germany =
            await response.json();


        let germanyFeatures = [];


        if (
            germany.type ===
            "FeatureCollection"
        ) {

            germanyFeatures =
                germany.features;

        }

        else if (
            germany.type ===
            "Feature"
        ) {

            germanyFeatures = [
                germany
            ];

        }

        else {

            germanyFeatures = [

                {
                    type: "Feature",

                    properties: {},

                    geometry: germany
                }

            ];
        }


        // ==================================================
        // DEUTSCHLAND-GEOMETRIE SAMMELN
        // ==================================================

        let germanyPolygons = [];


        for (
            const feature
            of germanyFeatures
        ) {

            if (
                !feature.geometry
            ) {

                continue;
            }


            if (
                feature.geometry.type ===
                "Polygon"
            ) {

                germanyPolygons.push(

                    feature.geometry.coordinates

                );

            }


            else if (
                feature.geometry.type ===
                "MultiPolygon"
            ) {

                germanyPolygons.push(

                    ...feature.geometry.coordinates

                );
            }
        }


        // ==================================================
        // WELTFLÄCHE
        // ==================================================

        const worldRing = [

            [-180, -85],

            [180, -85],

            [180, 85],

            [-180, 85],

            [-180, -85]
        ];


        // ==================================================
        // DEUTSCHLAND ALS LOCH
        // ==================================================

        const holes = [];


        for (
            const polygon
            of germanyPolygons
        ) {

            if (
                polygon.length > 0
            ) {

                holes.push(

                    polygon[0]

                );
            }
        }


        // ==================================================
        // AUSLAND GRAU
        // ==================================================

        if (
            holes.length > 0
        ) {

            map.addSource(

                "germany-mask",

                {

                    type: "geojson",

                    data: {

                        type: "Feature",

                        properties: {},

                        geometry: {

                            type: "Polygon",

                            coordinates: [

                                worldRing,

                                ...holes
                            ]
                        }
                    }
                }
            );


            map.addLayer({

                id: "germany-mask",

                type: "fill",

                source: "germany-mask",

                paint: {

                    "fill-color":
                        "#555555",

                    "fill-opacity":
                        0.58
                }
            });
        }


        // ==================================================
        // DEUTSCHLAND-GRENZE
        // ==================================================

        map.addSource(

            "germany-border",

            {

                type: "geojson",

                data: germany
            }
        );


        map.addLayer({

            id: "germany-border",

            type: "line",

            source: "germany-border",

            paint: {

                "line-color":
                    "#222222",

                "line-width":
                    2.5
            }
        });


        // ==================================================
        // DEUTSCHLAND AUTOMATISCH EINPASSEN
        // ==================================================

        const bounds =
            new maplibregl.LngLatBounds();


        for (
            const feature
            of germanyFeatures
        ) {

            const geometry =
                feature.geometry;


            function addCoordinates(
                coordinates
            ) {

                if (
                    typeof coordinates[0] ===
                    "number"
                ) {

                    bounds.extend(
                        coordinates
                    );

                    return;
                }


                for (
                    const coordinate
                    of coordinates
                ) {

                    addCoordinates(
                        coordinate
                    );
                }
            }


            addCoordinates(
                geometry.coordinates
            );
        }


        if (
            !bounds.isEmpty()
        ) {

            map.fitBounds(

                bounds,

                {

                    padding: 30
                }
            );
        }


    }

    catch (error) {

        console.error(
            "Fehler bei Deutschlandmaske:",
            error
        );
    }
}


// ==========================================================
// WARNDREIECK ERZEUGEN
// ==========================================================

function createAccidentMarker(
    accident
) {

    const ended =
        Boolean(
            accident.removed_at
        );


    const element =
        document.createElement(
            "div"
        );


    element.className =

        ended

            ? "accident-marker accident-ended"

            : "accident-marker accident-current";


    /*
     * WICHTIG:
     *
     * anchor = bottom
     *
     * Damit liegt der untere Mittelpunkt
     * des HTML-Elements exakt auf der
     * angegebenen Koordinate.
     *
     * Das Dreieck selbst ist so konstruiert,
     * dass seine Spitze genau dort liegt.
     */

    const marker =
        new maplibregl.Marker({

            element:
                element,

            anchor:
                "bottom"
        });


    marker.setLngLat([

        Number(
            accident.longitude
        ),

        Number(
            accident.latitude
        )

    ]);


    // ======================================================
    // MOUSEOVER
    // ======================================================

    element.addEventListener(

        "mouseenter",

        () => {

            showAccidentPopup(

                marker,

                accident
            );
        }
    );


    element.addEventListener(

        "mouseleave",

        () => {

            if (
                marker._popup
            ) {

                marker._popup.remove();

                marker._popup =
                    null;
            }
        }
    );


    marker.addTo(
        map
    );


    return marker;
}


// ==========================================================
// POPUP
// ==========================================================

function showAccidentPopup(
    marker,
    accident
) {

    const city =
        escapeHtml(
            accident.city
        ) ||
        "unbekannt";


    const street =
        escapeHtml(
            accident.street
        ) ||
        "unbekannt";


    let html;


    // ======================================================
    // AKTUELL
    // ======================================================

    if (
        currentMode === "current" ||
        !accident.removed_at
    ) {

        const reliability =
            escapeHtml(
                accident.reliability
            ) ||
            "unbekannt";


        html = `

            <div class="tooltip-title">
                ${city}
            </div>

            Straße:
            ${street}

            <br>

            Zuverlässigkeit:
            ${reliability}

            <br>

            Meldung:
            ${formatDate(
                accident.created_at
            )}

            <br>

            Bestätigt:
            ${formatDate(
                accident.confirmed_at
            )}

        `;

    }


    // ======================================================
    // BEENDET
    // ======================================================

    else {

        html = `

            <div class="tooltip-title">
                ${city}
            </div>

            Straße:
            ${street}

            <br>

            Anfang:
            ${formatDate(
                accident.created_at
            )}

            <br>

            Ende:
            ${formatDate(
                accident.removed_at
            )}

        `;
    }


    const popup =
        new maplibregl.Popup({

            closeButton:
                false,

            closeOnClick:
                false,

            offset:
                8
        });


    popup
        .setLngLat(
            marker.getLngLat()
        )
        .setHTML(
            html
        )
        .addTo(
            map
        );


    marker._popup =
        popup;
}


// ==========================================================
// DATUM FORMATIEREN
// ==========================================================

function formatDate(
    value
) {

    if (!value) {

        return "unbekannt";
    }


    const date =
        new Date(
            value
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;
    }


    return date.toLocaleString(

        "de-DE",

        {

            dateStyle:
                "short",

            timeStyle:
                "medium"
        }
    );
}


// ==========================================================
// HTML ESCAPEN
// ==========================================================

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


// ==========================================================
// MARKER ENTFERNEN
// ==========================================================

function clearAccidentMarkers() {

    for (
        const marker
        of accidentMarkers
    ) {

        if (
            marker._popup
        ) {

            marker._popup.remove();

            marker._popup =
                null;
        }


        marker.remove();
    }


    accidentMarkers = [];
}


// ==========================================================
// UNFÄLLE LADEN
// ==========================================================

async function loadAccidents() {

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.textContent =
            "Lade Unfallmeldungen …";


        const response =
            await fetch(

                API_URL +
                "?mode=" +
                encodeURIComponent(
                    currentMode
                ),

                {

                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(

                "HTTP " +
                response.status

            );
        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(

                data.error ||
                "API-Fehler"

            );
        }


        // Alte Marker löschen

        clearAccidentMarkers();


        let markerCount = 0;


        // ==================================================
        // NEUE MARKER
        // ==================================================

        for (
            const accident
            of data.accidents
        ) {

            const latitude =
                Number(
                    accident.latitude
                );


            const longitude =
                Number(
                    accident.longitude
                );


            if (
                !Number.isFinite(
                    latitude
                ) ||
                !Number.isFinite(
                    longitude
                )
            ) {

                continue;
            }


            const marker =
                createAccidentMarker(
                    accident
                );


            accidentMarkers.push(
                marker
            );


            markerCount++;
        }


        // ==================================================
        // STATUS
        // ==================================================

        if (
            currentMode ===
            "current"
        ) {

            status.textContent =
                markerCount +
                " aktuelle Unfallmeldungen";

        }

        else {

            status.textContent =
                markerCount +
                " Unfallmeldungen der letzten 24 Stunden";
        }


    }

    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "Fehler beim Laden der Unfallmeldungen";
    }
}


// ==========================================================
// MODUS WECHSELN
// ==========================================================

function setMode(
    mode
) {

    currentMode =
        mode;


    document
        .getElementById(
            "currentButton"
        )
        .classList.toggle(

            "active",

            mode ===
                "current"
        );


    document
        .getElementById(
            "dayButton"
        )
        .classList.toggle(

            "active",

            mode ===
                "24h"
        );


    loadAccidents();
}


// ==========================================================
// BUTTONS
// ==========================================================

document
    .getElementById(
        "currentButton"
    )
    .addEventListener(

        "click",

        () => {

            setMode(
                "current"
            );
        }
    );


document
    .getElementById(
        "dayButton"
    )
    .addEventListener(

        "click",

        () => {

            setMode(
                "24h"
            );
        }
    );


// ==========================================================
// START
// ==========================================================

map.on(

    "load",

    async () => {

        await createGermanyMask();

        await loadAccidents();
    }
);


// ==========================================================
// ALLE 5 MINUTEN AKTUALISIEREN
// ==========================================================

setInterval(

    loadAccidents,

    5 * 60 * 1000

);


</script>

</body>
</html>
