<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verkehrslage – Unfälle Deutschland</title>

    <link
        href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* =========================================
           BUTTONS
           ========================================= */

        .controls {
            position: absolute;
            z-index: 2000;
            top: 10px;
            left: 10px;

            background: white;
            padding: 5px;

            border-radius: 7px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.3);

            display: flex;
            gap: 5px;
        }

        .controls button {
            border: none;

            padding: 9px 14px;

            border-radius: 5px;

            background: #eeeeee;

            cursor: pointer;

            font-weight: bold;
            font-size: 13px;
        }

        .controls button:hover {
            background: #dddddd;
        }

        .controls button.active {
            background: #1976d2;
            color: white;
        }

        #downloadButton {
            width: 42px;
            padding-left: 0 !important;
            padding-right: 0 !important;
            font-size: 20px !important;
            line-height: 1;
        }

        .download-dialog {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.35);
        }

        .download-dialog[hidden] {
            display: none;
        }

        .download-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            min-width: 280px;
        }

        .download-box input {
            width: 100%;
            padding: 9px;
            margin: 12px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 14px;
        }

        .download-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .download-actions button {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        #downloadError {
            margin-top: 8px;
            color: #c62828;
            font-size: 12px;
        }

        /* =========================================
           TITEL
           ========================================= */

        .title-box {
            position: absolute;
            z-index: 2000;

            top: 10px;
            left: 50%;

            transform: translateX(-50%);

            background: white;

            padding: 8px 14px;

            border-radius: 6px;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.3);

            font-weight: bold;
        }

        /* =========================================
           STATUS
           ========================================= */

        .status-box {
            position: absolute;
            z-index: 2000;

            bottom: 10px;
            left: 10px;

            background: white;

            padding: 7px 10px;

            border-radius: 5px;

            box-shadow:
                0 2px 6px rgba(0,0,0,0.25);

            font-size: 12px;
        }

        /* =========================================
           POPUP
           ========================================= */

        .maplibregl-popup-content {
            font-size: 13px;
            line-height: 1.45;

            padding: 10px 12px;
        }

        .tooltip-title {
            font-size: 15px;
            font-weight: bold;

            margin-bottom: 4px;
        }

    </style>
</head>

<body>

<div class="controls">

    <button
        id="currentButton"
        class="active"
    >
        AKTUELL
    </button>

    <button
        id="dayButton"
    >
        24h
    </button>

    <button
        id="allButton"
    >
        ALLE
    </button>

    <button
        id="downloadButton"
        title="Datenbank herunterladen"
        aria-label="Datenbank herunterladen"
    >
        ⇩
    </button>

</div>


<div
    id="downloadDialog"
    class="download-dialog"
    hidden
>
    <div class="download-box">
        <b id="dialogTitle">Datenbank herunterladen</b>

        <input
            id="downloadPassword"
            type="password"
            placeholder="Passwort"
            autocomplete="off"
        >

        <div class="download-actions">
            <button id="cancelDownload">Abbrechen</button>
            <button id="confirmDownload">Herunterladen</button>
        </div>

        <div id="downloadError"></div>
    </div>
</div>

<div id="map"></div>


<div
    class="status-box"
    id="status"
>
    Lade Unfallmeldungen …
</div>


<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>


<script>

// ==========================================================
// KONFIGURATION
// ==========================================================

const API_URL =
    "https://accde-api.r73d.workers.dev/api/accidents";

const ALL_URL =
    "https://accde-api.r73d.workers.dev/api/accidents/all";

let currentMode = "current";


// ==========================================================
// KARTE
// ==========================================================

const map = new maplibregl.Map({

    container: "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center: [
        10.4515,
        51.1657
    ],

    zoom: 5.5,

    minZoom: 4,

    maxZoom: 18,

    attributionControl: true
});


map.addControl(
    new maplibregl.NavigationControl(),
    "top-right"
);


// ==========================================================
// DATUM
// ==========================================================

function formatDate(value) {

    if (!value) {
        return "unbekannt";
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString(
        "de-DE",
        {
            dateStyle: "short",
            timeStyle: "medium"
        }
    );
}


// ==========================================================
// HTML ESCAPEN
// ==========================================================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// ==========================================================
// DEUTSCHLAND-MASKE
// ==========================================================




// ==========================================================
// UNFALL-DATEN ALS GEOJSON
// ==========================================================

function accidentsToGeoJSON(
    accidents
) {

    const features = [];


    for (
        const accident
        of accidents
    ) {

        const latitude =
            Number(
                accident.latitude
            );

        const longitude =
            Number(
                accident.longitude
            );


        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
        ) {

            continue;
        }


        features.push({

            type: "Feature",

            geometry: {

                type: "Point",

                coordinates: [
                    longitude,
                    latitude
                ]
            },

            properties: {

                id:
                    accident.id,

                city:
                    accident.city || "",

                street:
                    accident.street || "",

                state:
                    accident.state || "",

                reliability:
                    accident.reliability || "",

                created_at:
                    accident.created_at || "",

                confirmed_at:
                    accident.confirmed_at || "",

                first_seen_at:
                    accident.first_seen_at || "",

                last_seen_at:
                    accident.last_seen_at || "",

                removed_at:
                    accident.removed_at || ""
            }
        });
    }


    return {

        type: "FeatureCollection",

        features: features
    };
}


// ==========================================================
// UNFALL-LAYER ERSTELLEN
// ==========================================================

function createAccidentLayers() {

    // Falls bereits vorhanden löschen

    if (
        map.getLayer(
            "accidents-current"
        )
    ) {

        map.removeLayer(
            "accidents-current"
        );
    }


    if (
        map.getLayer(
            "accidents-ended"
        )
    ) {

        map.removeLayer(
            "accidents-ended"
        );
    }


    if (
        map.getSource(
            "accidents"
        )
    ) {

        map.removeSource(
            "accidents"
        );
    }


    // ======================================================
    // SOURCE
    // ======================================================

    map.addSource(

        "accidents",

        {

            type: "geojson",

            data: {
                type: "FeatureCollection",

                features: []
            }
        }
    );


    // ======================================================
    // AKTUELLE UNFÄLLE
    // ======================================================

    map.addLayer({

        id:
            "accidents-current",

        type:
            "symbol",

        source:
            "accidents",

        filter: [

            "==",

            [
                "get",
                "removed_at"
            ],

            ""
        ],

        layout: {

            "icon-image":
                "triangle-current",

            "icon-size":
                1.3,

            "icon-allow-overlap":
                true,

            "icon-ignore-placement":
                true
        },

        paint: {

            "icon-color":
                "#d71920",

            "icon-halo-color":
                "#ffffff",

            "icon-halo-width":
                1.5
        }
    });


    // ======================================================
    // BEENDETE UNFÄLLE
    // ======================================================

    map.addLayer({

        id:
            "accidents-ended",

        type:
            "symbol",

        source:
            "accidents",

        filter: [

            "!=",

            [
                "get",
                "removed_at"
            ],

            ""
        ],

        layout: {

            "icon-image":
                "triangle-ended",

            "icon-size":
                1.3,

            "icon-allow-overlap":
                true,

            "icon-ignore-placement":
                true
        },

        paint: {

            "icon-color":
                "#777777",

            "icon-halo-color":
                "#ffffff",

            "icon-halo-width":
                1.5
        }
    });
}


// ==========================================================
// UNFALL-SYMBOL
// ==========================================================

function createTriangleImage() {

    /*
     * Zwei echte Raster-Icons.
     *
     * Gegenüber der vorherigen Version exakt halb so groß:
     * 24 x 24 statt 48 x 48 Pixel.
     *
     * Die Farben sind direkt im jeweiligen Bild enthalten.
     */

    const size = 24;

    function makeTriangle(fillColor) {

        const canvas =
            document.createElement("canvas");

        canvas.width = size;
        canvas.height = size;

        const ctx =
            canvas.getContext("2d");

        /*
         * Dreieck
         */
        ctx.beginPath();

        ctx.moveTo(
            size / 2,
            2
        );

        ctx.lineTo(
            22,
            22
        );

        ctx.lineTo(
            2,
            22
        );

        ctx.closePath();

        /*
         * Füllung
         */
        ctx.fillStyle =
            fillColor;

        ctx.fill();

        /*
         * Dünner schwarzer Rand
         */
        ctx.lineWidth = 1;

        ctx.strokeStyle =
            "#000000";

        ctx.stroke();

        /*
         * Ausrufezeichen
         */
        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 13px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "!",
            size / 2,
            15
        );

        return ctx.getImageData(
            0,
            0,
            size,
            size
        );
    }


    /*
     * Aktuell = rot
     */
    if (!map.hasImage("triangle-current")) {

        map.addImage(
            "triangle-current",
            makeTriangle("#d71920"),
            {
                pixelRatio: 2
            }
        );
    }


    /*
     * Beendet = hellgrau
     */
    if (!map.hasImage("triangle-ended")) {

        map.addImage(
            "triangle-ended",
            makeTriangle("#d3d3d3"),
            {
                pixelRatio: 2
            }
        );
    }
}

// ==========================================================
// POPUP
// ==========================================================

function showAccidentPopup(
    feature
) {

    const p =
        feature.properties;


    const city =
        escapeHtml(
            p.city
        ) ||
        "unbekannt";


    const street =
        escapeHtml(
            p.street
        ) ||
        "unbekannt";


    let html;


    // ======================================================
    // AKTUELL
    // ======================================================

    if (
        currentMode ===
        "current" ||
        !p.removed_at
    ) {

        const reliability =
            escapeHtml(
                p.reliability
            ) ||
            "unbekannt";


        html = `

            <div class="tooltip-title">
                ${city}
            </div>

            Straße:
            ${street}

            <br>

            Zuverlässigkeit:
            ${reliability}

            <br>

            Meldung:
            ${formatDate(
                p.created_at
            )}

            <br>

            Bestätigt:
            ${formatDate(
                p.confirmed_at
            )}

        `;

    }


    // ======================================================
    // BEENDET
    // ======================================================

    else {

        html = `

            <div class="tooltip-title">
                ${city}
            </div>

            Straße:
            ${street}

            <br>

            Anfang:
            ${formatDate(
                p.created_at
            )}

            <br>

            Ende:
            ${formatDate(
                p.removed_at
            )}

        `;
    }


    const popup =
        new maplibregl.Popup({

            closeButton:
                false,

            closeOnClick:
                false,

            offset:
                12
        });


    popup
        .setLngLat(
            feature.geometry.coordinates
        )
        .setHTML(
            html
        )
        .addTo(
            map
        );
}


// ==========================================================
// UNFÄLLE DARSTELLEN
// ==========================================================

function displayAccidents(accidents, mode) {

    currentMode = mode;

    const status = document.getElementById("status");
    const geojson = accidentsToGeoJSON(accidents);

    const source = map.getSource("accidents");

    if (source) {
        source.setData(geojson);
    } else {
        createAccidentLayers();
        map.getSource("accidents").setData(geojson);
    }

    const count = geojson.features.length;

    if (mode === "current") {
        status.textContent = count + " aktuelle Unfallmeldungen";
    } else if (mode === "24h") {
        status.textContent = count + " Unfallmeldungen der letzten 24 Stunden";
    } else {
        status.textContent = count + " Meldungen aus der gesamten Datenbank";
    }

    updateModeButtons(mode);
}


// ==========================================================
// ÖFFENTLICHE ANSICHTEN LADEN (AKTUELL / 24H)
// ==========================================================

async function loadAccidents() {

    // Die passwortgeschützte "Alle"-Ansicht ist ein Snapshot.
    // Der öffentliche Fünf-Minuten-Refresh darf sie nicht durch die
    // ungeschützte Aktuell-Ansicht ersetzen.
    if (currentMode === "all") {
        return;
    }

    const status = document.getElementById("status");

    try {
        status.textContent = "Lade Unfallmeldungen …";

        const response = await fetch(
            API_URL + "?mode=" + encodeURIComponent(currentMode),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "API-Fehler");
        }

        displayAccidents(data.accidents, currentMode);

    } catch (error) {
        console.error(error);
        status.textContent = "Fehler beim Laden der Unfallmeldungen";
    }
}


// ==========================================================
// MOUSEOVER
// ==========================================================

function setupMouseEvents() {

    map.on(

        "mouseenter",

        "accidents-current",

        (event) => {

            map.getCanvas().style.cursor =
                "pointer";


            if (
                event.features &&
                event.features.length
            ) {

                showAccidentPopup(
                    event.features[0]
                );
            }
        }
    );


    map.on(

        "mouseleave",

        "accidents-current",

        () => {

            map.getCanvas().style.cursor =
                "";

            closePopups();
        }
    );


    map.on(

        "mouseenter",

        "accidents-ended",

        (event) => {

            map.getCanvas().style.cursor =
                "pointer";


            if (
                event.features &&
                event.features.length
            ) {

                showAccidentPopup(
                    event.features[0]
                );
            }
        }
    );


    map.on(

        "mouseleave",

        "accidents-ended",

        () => {

            map.getCanvas().style.cursor =
                "";

            closePopups();
        }
    );
}


// ==========================================================
// POPUPS SCHLIESSEN
// ==========================================================

function closePopups() {

    const popups =
        document.querySelectorAll(
            ".maplibregl-popup"
        );


    popups.forEach(
        popup => popup.remove()
    );
}


// ==========================================================
// BUTTON-ZUSTÄNDE UND MODUS WECHSELN
// ==========================================================

function updateModeButtons(mode) {
    document.getElementById("currentButton").classList.toggle("active", mode === "current");
    document.getElementById("dayButton").classList.toggle("active", mode === "24h");
    document.getElementById("allButton").classList.toggle("active", mode === "all");
}

function setMode(mode) {
    currentMode = mode;
    updateModeButtons(mode);
    closePopups();
    loadAccidents();
}

document.getElementById("currentButton").addEventListener("click", () => setMode("current"));
document.getElementById("dayButton").addEventListener("click", () => setMode("24h"));


// ==========================================================
// PASSWORTGESCHÜTZTES SQL-BACKUP UND ANSICHT "ALLE"
// ==========================================================

const DOWNLOAD_URL = "https://accde-api.r73d.workers.dev/download";
const downloadDialog = document.getElementById("downloadDialog");
const downloadPassword = document.getElementById("downloadPassword");
const downloadError = document.getElementById("downloadError");
const dialogTitle = document.getElementById("dialogTitle");
const confirmButton = document.getElementById("confirmDownload");
let passwordDialogAction = "download";

function openPasswordDialog(action) {
    passwordDialogAction = action;
    downloadPassword.value = "";
    downloadError.textContent = "";

    if (action === "all") {
        dialogTitle.textContent = "Alle Meldungen anzeigen";
        confirmButton.textContent = "Anzeigen";
    } else {
        dialogTitle.textContent = "Datenbank herunterladen";
        confirmButton.textContent = "Herunterladen";
    }

    downloadDialog.hidden = false;
    downloadPassword.focus();
}

document.getElementById("downloadButton").addEventListener(
    "click",
    () => openPasswordDialog("download")
);

document.getElementById("allButton").addEventListener(
    "click",
    () => openPasswordDialog("all")
);

document.getElementById("cancelDownload").addEventListener("click", () => {
    downloadDialog.hidden = true;
    downloadPassword.value = "";
});

downloadPassword.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        confirmButton.click();
    }
    if (event.key === "Escape") {
        downloadDialog.hidden = true;
        downloadPassword.value = "";
    }
});

confirmButton.addEventListener("click", async () => {
    const password = downloadPassword.value;

    if (!password) {
        downloadError.textContent = "Bitte Passwort eingeben.";
        return;
    }

    const action = passwordDialogAction;
    confirmButton.disabled = true;
    confirmButton.textContent = "Lade …";
    downloadError.textContent = "";

    try {
        if (action === "all") {
            const response = await fetch(ALL_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                cache: "no-store",
                body: JSON.stringify({ password })
            });

            if (response.status === 401) {
                throw new Error("Falsches Passwort.");
            }
            if (!response.ok) {
                throw new Error("Alle Meldungen konnten nicht geladen werden (HTTP " + response.status + ").");
            }

            const data = await response.json();
            if (!data.success || !Array.isArray(data.accidents)) {
                throw new Error(data.error || "Ungültige Antwort vom Server.");
            }

            closePopups();
            displayAccidents(data.accidents, "all");
            downloadDialog.hidden = true;
            downloadPassword.value = "";

        } else {
            const response = await fetch(DOWNLOAD_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                cache: "no-store",
                body: JSON.stringify({ password })
            });

            if (response.status === 401) {
                throw new Error("Falsches Passwort.");
            }
            if (!response.ok) {
                throw new Error("Download fehlgeschlagen (HTTP " + response.status + ").");
            }

            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const date = new Date().toISOString().slice(0, 10);

            link.href = objectUrl;
            link.download = "accde_backup_" + date + ".sql";
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);

            downloadDialog.hidden = true;
            downloadPassword.value = "";
        }

    } catch (error) {
        console.error("Passwortgeschützte Aktion:", error);
        downloadError.textContent = error.message || "Unbekannter Fehler.";
    } finally {
        confirmButton.disabled = false;
        confirmButton.textContent = passwordDialogAction === "all" ? "Anzeigen" : "Herunterladen";
    }
});


// ==========================================================
// START
// ==========================================================

map.on(
    "load",
    async () => {

        // Symbol registrieren
        createTriangleImage();

        // Unfall-Layer
        createAccidentLayers();

        // Mouseover
        setupMouseEvents();

        // Unfälle
        await loadAccidents();
    }
);


// ==========================================================
// ALLE 5 MINUTEN AKTUALISIEREN
// ==========================================================

setInterval(
    loadAccidents,
    5 * 60 * 1000
);

</script>

</body>
</html>
