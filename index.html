<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verkehrslage – Unfälle Deutschland</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }


        /* ==========================================
           BUTTONS
           ========================================== */

        .controls {
            position: absolute;
            z-index: 2000;

            top: 10px;
            left: 10px;

            background: white;

            padding: 5px;

            border-radius: 7px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.3);

            display: flex;
            gap: 5px;
        }


        .controls button {

            border: none;

            padding: 9px 14px;

            border-radius: 5px;

            background: #eeeeee;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;
        }


        .controls button:hover {

            background: #dddddd;
        }


        .controls button.active {

            background: #1976d2;

            color: white;
        }


        /* ==========================================
           TITEL
           ========================================== */

        .title-box {

            position: absolute;

            z-index: 2000;

            top: 10px;

            left: 50%;

            transform: translateX(-50%);

            background: white;

            padding: 8px 14px;

            border-radius: 6px;

            box-shadow:
                0 2px 7px rgba(0,0,0,0.3);

            font-weight: bold;
        }


        /* ==========================================
           STATUS
           ========================================== */

        .status-box {

            position: absolute;

            z-index: 2000;

            bottom: 10px;

            left: 10px;

            background: white;

            padding: 7px 10px;

            border-radius: 5px;

            box-shadow:
                0 2px 6px rgba(0,0,0,0.25);

            font-size: 12px;
        }


        /* ==========================================
           UNFALL-WARNDREIECK
           ========================================== */

        .accident-marker {

            position: relative;

            width: 30px;

            height: 27px;

            filter:
                drop-shadow(
                    0 2px 3px rgba(0,0,0,0.55)
                );
        }


        .accident-marker::before {

            content: "";

            position: absolute;

            left: 1px;

            top: 0;

            width: 0;

            height: 0;

            border-left: 14px solid transparent;

            border-right: 14px solid transparent;

            border-bottom: 26px solid var(--marker-color);
        }


        .accident-marker::after {

            content: "!";

            position: absolute;

            left: 0;

            top: 3px;

            width: 30px;

            text-align: center;

            color: white;

            font-weight: bold;

            font-size: 17px;

            line-height: 22px;

            text-shadow:
                0 1px 1px rgba(0,0,0,0.4);
        }


        /* Aktuell */

        .accident-current {

            --marker-color: #d71920;
        }


        /* Beendet */

        .accident-ended {

            --marker-color: #777777;
        }


        /* ==========================================
           TOOLTIPS
           ========================================== */

        .leaflet-tooltip {

            font-size: 13px;

            line-height: 1.45;
        }


        .tooltip-title {

            font-weight: bold;

            font-size: 14px;

            margin-bottom: 4px;
        }

    </style>

</head>


<body>


<div class="controls">

    <button
        id="currentButton"
        class="active"
        onclick="setMode('current')"
    >
        AKTUELL
    </button>


    <button
        id="dayButton"
        onclick="setMode('24h')"
    >
        LETZTE 24 H
    </button>

</div>


<div class="title-box">

    🚨 Unfallmeldungen Deutschland

</div>


<div id="map"></div>


<div
    class="status-box"
    id="status"
>
    Lade Unfallmeldungen …
</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// ==========================================================
// KONFIGURATION
// ==========================================================

const API_URL =
    "https://accde-api.r73d.workers.dev/api/accidents";


const GERMANY_GEOJSON =
    "https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/1_deutschland/1_deutschland_low.geo.json";


let currentMode = "current";


const accidentLayer =
    L.layerGroup();


const germanyLayer =
    L.layerGroup();


// ==========================================================
// KARTE
// ==========================================================

const map = L.map("map", {

    center: [
        51.1657,
        10.4515
    ],

    zoom: 6,

    minZoom: 5,

    maxZoom: 18
});


// ==========================================================
// KARTENKACHELN
// ==========================================================

L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom: 19,

        attribution:
            "Tiles © Esri — Source: Esri, Garmin, FAO, NOAA, USGS"
    }

).addTo(map);


// Layer-Reihenfolge

germanyLayer.addTo(map);

accidentLayer.addTo(map);


// ==========================================================
// DEUTSCHLAND + AUSLANDSMASKE
// ==========================================================

async function loadGermanyMask() {

    try {

        const response =
            await fetch(
                GERMANY_GEOJSON
            );


        if (!response.ok) {

            throw new Error(
                "Deutschland-GeoJSON konnte nicht geladen werden."
            );
        }


        const germany =
            await response.json();


        // ----------------------------------------------
        // Grenzen auslesen
        // ----------------------------------------------

        let germanyPolygons = [];


        if (
            germany.type === "FeatureCollection"
        ) {

            for (
                const feature
                of germany.features
            ) {

                if (
                    feature.geometry &&
                    feature.geometry.type === "Polygon"
                ) {

                    germanyPolygons.push(
                        feature.geometry.coordinates
                    );

                }

                else if (
                    feature.geometry &&
                    feature.geometry.type === "MultiPolygon"
                ) {

                    germanyPolygons.push(
                        ...feature.geometry.coordinates
                    );
                }
            }

        }

        else if (
            germany.type === "Feature"
        ) {

            if (
                germany.geometry.type === "Polygon"
            ) {

                germanyPolygons.push(
                    germany.geometry.coordinates
                );

            }

            else if (
                germany.geometry.type === "MultiPolygon"
            ) {

                germanyPolygons.push(
                    ...germany.geometry.coordinates
                );
            }
        }


        // ----------------------------------------------
        // Weltfläche
        // ----------------------------------------------

        const world = [

            [
                [90, -180],
                [90, 180],
                [-90, 180],
                [-90, -180],
                [90, -180]
            ]

        ];


        // ----------------------------------------------
        // Deutschland als Loch
        // ----------------------------------------------

        const holes = [];


        for (
            const polygon
            of germanyPolygons
        ) {

            if (
                polygon.length > 0
            ) {

                holes.push(
                    polygon[0]
                );
            }
        }


        // ----------------------------------------------
        // Ausland ausgrauen
        // ----------------------------------------------

        if (
            holes.length > 0
        ) {

            L.polygon(

                [
                    world[0],
                    ...holes
                ],

                {

                    stroke: false,

                    fillColor: "#666666",

                    fillOpacity: 0.48,

                    interactive: false
                }

            ).addTo(germanyLayer);
        }


        // ----------------------------------------------
        // Deutschlandgrenze
        // ----------------------------------------------

        L.geoJSON(

            germany,

            {

                style: {

                    color: "#222222",

                    weight: 2.5,

                    fill: false
                },

                interactive: false
            }

        ).addTo(germanyLayer);


        // ----------------------------------------------
        // Deutschland automatisch einpassen
        // ----------------------------------------------

        const bounds =
            L.geoJSON(
                germany
            ).getBounds();


        map.fitBounds(

            bounds,

            {

                padding: [
                    20,
                    20
                ]
            }
        );


    }

    catch (error) {

        console.error(
            "Deutschlandmaske:",
            error
        );
    }
}


// ==========================================================
// UNFALLMARKER
// ==========================================================

function createAccidentIcon(
    ended
) {

    const className =
        ended
            ? "accident-marker accident-ended"
            : "accident-marker accident-current";


    return L.divIcon({

        className: "",

        html:
            `<div class="${className}"></div>`,

        iconSize: [
            30,
            27
        ],

        iconAnchor: [
            15,
            27
        ]
    });
}


// ==========================================================
// DATUM
// ==========================================================

function formatDate(
    value
) {

    if (!value) {

        return "unbekannt";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return value;
    }


    return date.toLocaleString(

        "de-DE",

        {

            dateStyle: "short",

            timeStyle: "medium"
        }
    );
}


// ==========================================================
// HTML ESCAPEN
// ==========================================================

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


// ==========================================================
// TOOLTIP
// ==========================================================

function createTooltip(
    accident
) {

    const city =
        escapeHtml(
            accident.city
        ) ||
        "unbekannt";


    const street =
        escapeHtml(
            accident.street
        ) ||
        "unbekannt";


    // ==============================================
    // AKTUELL
    // ==============================================

    if (
        currentMode === "current" ||
        !accident.removed_at
    ) {

        const reliability =
            escapeHtml(
                accident.reliability
            ) ||
            "unbekannt";


        return `

            <div class="tooltip-title">
                ${city}
            </div>

            Straße:
            ${street}

            <br>

            Zuverlässigkeit:
            ${reliability}

            <br>

            Meldung:
            ${formatDate(
                accident.created_at
            )}

            <br>

            Bestätigt:
            ${formatDate(
                accident.confirmed_at
            )}

        `;
    }


    // ==============================================
    // BEENDET
    // ==============================================

    return `

        <div class="tooltip-title">
            ${city}
        </div>

        Straße:
        ${street}

        <br>

        Anfang:
        ${formatDate(
            accident.created_at
        )}

        <br>

        Ende:
        ${formatDate(
            accident.removed_at
        )}

    `;
}


// ==========================================================
// UNFÄLLE LADEN
// ==========================================================

async function loadAccidents() {

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.textContent =
            "Lade Unfallmeldungen …";


        const response =
            await fetch(

                API_URL +
                "?mode=" +
                encodeURIComponent(
                    currentMode
                ),

                {

                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "API-Fehler"
            );
        }


        // Alte Marker entfernen

        accidentLayer.clearLayers();


        let markerCount = 0;


        // ==============================================
        // MARKER
        // ==============================================

        for (
            const accident
            of data.accidents
        ) {


            const latitude =
                Number(
                    accident.latitude
                );


            const longitude =
                Number(
                    accident.longitude
                );


            if (
                !Number.isFinite(
                    latitude
                ) ||
                !Number.isFinite(
                    longitude
                )
            ) {

                continue;
            }


            const ended =
                Boolean(
                    accident.removed_at
                );


            const marker =
                L.marker(

                    [
                        latitude,
                        longitude
                    ],

                    {

                        icon:
                            createAccidentIcon(
                                ended
                            )
                    }
                );


            marker.bindTooltip(

                createTooltip(
                    accident
                ),

                {

                    direction: "top",

                    sticky: true,

                    opacity: 0.96
                }
            );


            marker.addTo(
                accidentLayer
            );


            markerCount++;
        }


        // ==============================================
        // STATUS
        // ==============================================

        if (
            currentMode === "current"
        ) {

            status.textContent =
                markerCount +
                " aktuelle Unfallmeldungen";

        }

        else {

            status.textContent =
                markerCount +
                " Unfallmeldungen der letzten 24 Stunden";
        }


    }

    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "Fehler beim Laden der Unfallmeldungen";
    }
}


// ==========================================================
// MODUS
// ==========================================================

function setMode(
    mode
) {

    currentMode =
        mode;


    const currentButton =
        document.getElementById(
            "currentButton"
        );


    const dayButton =
        document.getElementById(
            "dayButton"
        );


    if (
        mode === "current"
    ) {

        currentButton.classList.add(
            "active"
        );

        dayButton.classList.remove(
            "active"
        );

    }

    else {

        currentButton.classList.remove(
            "active"
        );

        dayButton.classList.add(
            "active"
        );
    }


    loadAccidents();
}


// ==========================================================
// START
// ==========================================================

loadGermanyMask();

loadAccidents();


// ==========================================================
// AUTOMATISCHE AKTUALISIERUNG
// ==========================================================

setInterval(

    loadAccidents,

    5 * 60 * 1000

);

</script>

</body>
</html>
