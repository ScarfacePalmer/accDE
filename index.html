<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unfallkarte Deutschland</title>

    <link
        href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           Buttons
        ===================================================== */

        #controls {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 20;

            display: flex;
            gap: 6px;

            background: rgba(255,255,255,0.96);

            padding: 6px;

            border-radius: 8px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.25);
        }

        #controls button {

            border: none;

            border-radius: 6px;

            padding: 8px 14px;

            background: #eeeeee;

            color: #222;

            font-size: 14px;

            cursor: pointer;
        }

        #controls button:hover {
            background: #dddddd;
        }

        #controls button.active {

            background: #333;

            color: white;
        }


        /* =====================================================
           Status
        ===================================================== */

        #status {

            position: absolute;

            bottom: 12px;
            left: 12px;

            z-index: 20;

            background: rgba(255,255,255,0.94);

            padding: 7px 10px;

            border-radius: 6px;

            font-size: 13px;

            box-shadow:
                0 1px 5px rgba(0,0,0,0.2);
        }


        /* =====================================================
           Legende
        ===================================================== */

        #legend {

            position: absolute;

            top: 12px;
            right: 60px;

            z-index: 20;

            background: rgba(255,255,255,0.95);

            padding: 8px 11px;

            border-radius: 7px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.22);

            font-size: 13px;
        }

        .legend-item {

            display: flex;

            align-items: center;

            margin: 3px 0;
        }

        .legend-symbol {

            width: 25px;

            text-align: center;

            font-size: 20px;

            margin-right: 5px;
        }

        .legend-current {
            color: #777777;
        }

        .legend-ended {
            color: #d43b32;
        }


        /* =====================================================
           Popup
        ===================================================== */

        .popup {

            min-width: 230px;

            font-size: 13px;

            line-height: 1.45;
        }

        .popup-title {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .popup-row {

            margin: 3px 0;
        }

        .popup-label {

            font-weight: bold;
        }

        .current-title {
            color: #666666;
        }

        .ended-title {
            color: #d43b32;
        }

    </style>
</head>


<body>


<div id="map"></div>


<!-- =========================================================
     Steuerung
========================================================= -->

<div id="controls">

    <button
        id="btnCurrent"
        class="active"
    >
        Aktuell
    </button>

    <button
        id="btn24h"
    >
        Letzte 24 Stunden
    </button>

</div>


<!-- =========================================================
     Legende
========================================================= -->

<div id="legend">

    <div class="legend-item">

        <span class="legend-symbol legend-current">
            ⚠
        </span>

        Aktuelle Meldung

    </div>


    <div class="legend-item">

        <span class="legend-symbol legend-ended">
            ⚠
        </span>

        Beendete Meldung

    </div>

</div>


<div id="status">
    Lade Unfalldaten …
</div>


<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>


<script>


/* ============================================================
   API
============================================================ */

const API_URL =
    "https://accde-api.r73d.workers.dev/api/accidents";


/* ============================================================
   Karte
============================================================ */

const map = new maplibregl.Map({

    container: "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center: [
        10.45,
        51.20
    ],

    zoom: 5.5,

    attributionControl: true

});


map.addControl(
    new maplibregl.NavigationControl(),
    "top-right"
);


/* ============================================================
   Globale Variablen
============================================================ */

let accidents = [];

let currentMode = "current";

let hoverPopup = null;


/* ============================================================
   Hilfsfunktionen
============================================================ */

function getValue(
    obj,
    names,
    fallback = null
) {

    for (const name of names) {

        if (
            obj[name] !== undefined &&
            obj[name] !== null &&
            obj[name] !== ""
        ) {

            return obj[name];
        }
    }

    return fallback;
}


function toNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return null;
    }


    const n = Number(value);


    if (
        !Number.isFinite(n)
    ) {

        return null;
    }


    return n;
}


function formatDate(value) {

    if (!value) {

        return "unbekannt";
    }


    const d =
        new Date(value);


    if (
        isNaN(d.getTime())
    ) {

        return String(value);
    }


    return d.toLocaleString(
        "de-DE",
        {
            dateStyle: "short",
            timeStyle: "medium"
        }
    );
}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* ============================================================
   SVG-Warndreiecke
============================================================ */

/*
 * Aktuelle Meldungen:
 * grau
 */

const currentIconSVG = `

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64"
>

    <path
        d="
            M32 5
            L60 56
            Q62 60 57 60
            H7
            Q2 60 4 56
            Z
        "

        fill="#777777"

        stroke="#ffffff"

        stroke-width="4"

        stroke-linejoin="round"
    />

    <rect
        x="29"
        y="22"
        width="6"
        height="20"
        rx="3"
        fill="white"
    />

    <circle
        cx="32"
        cy="49"
        r="3.2"
        fill="white"
    />

</svg>
`;


/*
 * Beendete Meldungen:
 * rot
 */

const endedIconSVG = `

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="64"
    height="64"
    viewBox="0 0 64 64"
>

    <path
        d="
            M32 5
            L60 56
            Q62 60 57 60
            H7
            Q2 60 4 56
            Z
        "

        fill="#d43b32"

        stroke="#ffffff"

        stroke-width="4"

        stroke-linejoin="round"
    />

    <rect
        x="29"
        y="22"
        width="6"
        height="20"
        rx="3"
        fill="white"
    />

    <circle
        cx="32"
        cy="49"
        r="3.2"
        fill="white"
    />

</svg>
`;


/* ============================================================
   SVG → Image
============================================================ */

function svgToImage(svg) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.onload = () => {

                resolve(img);
            };


            img.onerror = reject;


            img.src =
                "data:image/svg+xml;charset=utf-8," +
                encodeURIComponent(svg);

        }
    );
}


/* ============================================================
   Marker-Icons laden
============================================================ */

async function addAccidentIcons() {

    const current =
        await svgToImage(
            currentIconSVG
        );


    const ended =
        await svgToImage(
            endedIconSVG
        );


    if (
        !map.hasImage(
            "accident-current"
        )
    ) {

        map.addImage(
            "accident-current",
            current,
            {
                pixelRatio: 2
            }
        );
    }


    if (
        !map.hasImage(
            "accident-ended"
        )
    ) {

        map.addImage(
            "accident-ended",
            ended,
            {
                pixelRatio: 2
            }
        );
    }

}


/* ============================================================
   Daten → GeoJSON
============================================================ */

function accidentsToGeoJSON(data) {

    const features = [];


    for (
        const accident of data
    ) {


        /* ----------------------------------------------------
           Koordinaten
        ---------------------------------------------------- */

        const latitude =
            toNumber(
                getValue(
                    accident,
                    [
                        "latitude",
                        "lat",
                        "Latitude",
                        "LAT"
                    ]
                )
            );


        const longitude =
            toNumber(
                getValue(
                    accident,
                    [
                        "longitude",
                        "lon",
                        "lng",
                        "Longitude",
                        "LON"
                    ]
                )
            );


        /*
         * Ohne gültige Koordinaten
         * keinen Marker erzeugen.
         */

        if (
            latitude === null ||
            longitude === null
        ) {

            continue;
        }


        /*
         * Deutschland / Umgebung:
         * verhindert versehentliche
         * völlig falsche Koordinaten.
         */

        if (
            latitude < 45 ||
            latitude > 56 ||
            longitude < 5 ||
            longitude > 16
        ) {

            continue;
        }


        /* ----------------------------------------------------
           Ort
        ---------------------------------------------------- */

        const city =
            getValue(
                accident,
                [
                    "city",
                    "ort",
                    "location",
                    "place"
                ],
                "Unbekannter Ort"
            );


        /* ----------------------------------------------------
           Straße
        ---------------------------------------------------- */

        const street =
            getValue(
                accident,
                [
                    "street",
                    "strasse",
                    "road"
                ],
                "Unbekannte Straße"
            );


        /* ----------------------------------------------------
           Zuverlässigkeit
        ---------------------------------------------------- */

        const reliability =
            getValue(
                accident,
                [
                    "reliability",
                    "zuverlaessigkeit",
                    "zuverlässigkeit"
                ],
                null
            );


        /* ----------------------------------------------------
           Meldungszeit
        ---------------------------------------------------- */

        const reported =
            getValue(
                accident,
                [
                    "reported_at",
                    "report_time",
                    "reported",
                    "meldung",
                    "timestamp",
                    "created_at",
                    "createdAt"
                ],
                null
            );


        /* ----------------------------------------------------
           Bestätigungszeit
        ---------------------------------------------------- */

        const confirmed =
            getValue(
                accident,
                [
                    "confirmed_at",
                    "confirmation_time",
                    "confirmed",
                    "bestaetigt",
                    "bestätigt"
                ],
                null
            );


        /* ----------------------------------------------------
           Anfang
        ---------------------------------------------------- */

        const start =
            getValue(
                accident,
                [
                    "start_time",
                    "started_at",
                    "begin",
                    "begonnen",
                    "first_seen"
                ],
                reported
            );


        /* ----------------------------------------------------
           Ende
        ---------------------------------------------------- */

        const end =
            getValue(
                accident,
                [
                    "end_time",
                    "ended_at",
                    "end",
                    "beendet",
                    "last_seen"
                ],
                null
            );


        /* ----------------------------------------------------
           ID
        ---------------------------------------------------- */

        const id =
            getValue(
                accident,
                [
                    "id",
                    "uuid",
                    "accident_id"
                ],
                `${latitude}_${longitude}_${reported}`
            );


        /*
         * Eine Meldung gilt als beendet,
         * wenn ein Endzeitpunkt vorhanden ist.
         */

        const ended =
            end !== null &&
            end !== "";


        /* ----------------------------------------------------
           GeoJSON Feature
        ---------------------------------------------------- */

        features.push({

            type: "Feature",

            id: String(id),

            geometry: {

                type: "Point",

                /*
                 * GANZ WICHTIG:
                 *
                 * GeoJSON:
                 *
                 * [longitude, latitude]
                 */

                coordinates: [
                    longitude,
                    latitude
                ]

            },

            properties: {

                id: String(id),

                ort: city,

                strasse: street,

                latitude: latitude,

                longitude: longitude,

                reliability: reliability,

                reported: reported,

                confirmed: confirmed,

                start: start,

                end: end,

                ended: ended

            }

        });

    }


    return {

        type: "FeatureCollection",

        features: features

    };

}


/* ============================================================
   Popup-Inhalt
============================================================ */

function createPopup(
    properties
) {

    const ended =
        properties.ended === true;


    let html =
        '<div class="popup">';


    /* ========================================================
       AKTUELL
    ======================================================== */

    if (!ended) {

        html += `

            <div
                class="popup-title current-title"
            >
                ⚠ Aktuelle Meldung
            </div>

            <div class="popup-row">

                <span class="popup-label">
                    Ort:
                </span>

                ${escapeHtml(
                    properties.ort
                )}

            </div>

            <div class="popup-row">

                <span class="popup-label">
                    Straße:
                </span>

                ${escapeHtml(
                    properties.strasse
                )}

            </div>

        `;


        if (
            properties.reliability !== null
        ) {

            html += `

                <div class="popup-row">

                    <span class="popup-label">
                        Zuverlässigkeit:
                    </span>

                    ${escapeHtml(
                        properties.reliability
                    )}

                </div>

            `;
        }


        html += `

            <div class="popup-row">

                <span class="popup-label">
                    Meldung:
                </span>

                ${escapeHtml(
                    formatDate(
                        properties.reported
                    )
                )}

            </div>

        `;


        if (
            properties.confirmed
        ) {

            html += `

                <div class="popup-row">

                    <span class="popup-label">
                        Bestätigt:
                    </span>

                    ${escapeHtml(
                        formatDate(
                            properties.confirmed
                        )
                    )}

                </div>

            `;
        }

    }


    /* ========================================================
       BEENDET
    ======================================================== */

    else {

        html += `

            <div
                class="popup-title ended-title"
            >
                ⚠ Beendete Meldung
            </div>

            <div class="popup-row">

                <span class="popup-label">
                    Ort:
                </span>

                ${escapeHtml(
                    properties.ort
                )}

            </div>

            <div class="popup-row">

                <span class="popup-label">
                    Straße:
                </span>

                ${escapeHtml(
                    properties.strasse
                )}

            </div>

            <div class="popup-row">

                <span class="popup-label">
                    Anfang:
                </span>

                ${escapeHtml(
                    formatDate(
                        properties.start
                    )
                )}

            </div>

            <div class="popup-row">

                <span class="popup-label">
                    Ende:
                </span>

                ${escapeHtml(
                    formatDate(
                        properties.end
                    )
                )}

            </div>

        `;

    }


    html +=
        "</div>";


    return html;
}


/* ============================================================
   Karte aktualisieren
============================================================ */

function updateMap() {

    const geojson =
        accidentsToGeoJSON(
            accidents
        );


    const source =
        map.getSource(
            "accidents"
        );


    if (source) {

        source.setData(
            geojson
        );

        return;
    }


    /* ========================================================
       GeoJSON Source
    ======================================================== */

    map.addSource(
        "accidents",
        {

            type: "geojson",

            data: geojson

        }
    );


    /* ========================================================
       AKTUELLE MELDUNGEN
    ======================================================== */

    map.addLayer({

        id: "accidents-current",

        type: "symbol",

        source: "accidents",

        filter: [
            "==",
            ["get", "ended"],
            false
        ],

        layout: {

            "icon-image":
                "accident-current",

            "icon-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                4, 0.32,

                7, 0.42,

                10, 0.52,

                14, 0.62

            ],

            "icon-anchor":
                "center",

            "icon-allow-overlap":
                true,

            "icon-ignore-placement":
                true

        }

    });


    /* ========================================================
       BEENDETE MELDUNGEN
    ======================================================== */

    map.addLayer({

        id: "accidents-ended",

        type: "symbol",

        source: "accidents",

        filter: [
            "==",
            ["get", "ended"],
            true
        ],

        layout: {

            "icon-image":
                "accident-ended",

            "icon-size": [

                "interpolate",

                ["linear"],

                ["zoom"],

                4, 0.32,

                7, 0.42,

                10, 0.52,

                14, 0.62

            ],

            "icon-anchor":
                "center",

            "icon-allow-overlap":
                true,

            "icon-ignore-placement":
                true

        }

    });


    /* ========================================================
       MOUSEOVER – AKTUELL
    ======================================================== */

    map.on(
        "mouseenter",
        "accidents-current",
        event => {

            map.getCanvas().style.cursor =
                "pointer";


            const feature =
                event.features?.[0];


            if (!feature) {
                return;
            }


            if (hoverPopup) {

                hoverPopup.remove();
            }


            hoverPopup =
                new maplibregl.Popup({

                    closeButton: false,

                    closeOnClick: false,

                    offset: 12,

                    maxWidth: "320px"

                })

                .setLngLat(
                    feature.geometry.coordinates
                )

                .setHTML(
                    createPopup(
                        feature.properties
                    )
                )

                .addTo(map);

        }
    );


    /* ========================================================
       MOUSEOVER – BEENDET
    ======================================================== */

    map.on(
        "mouseenter",
        "accidents-ended",
        event => {

            map.getCanvas().style.cursor =
                "pointer";


            const feature =
                event.features?.[0];


            if (!feature) {
                return;
            }


            if (hoverPopup) {

                hoverPopup.remove();
            }


            hoverPopup =
                new maplibregl.Popup({

                    closeButton: false,

                    closeOnClick: false,

                    offset: 12,

                    maxWidth: "320px"

                })

                .setLngLat(
                    feature.geometry.coordinates
                )

                .setHTML(
                    createPopup(
                        feature.properties
                    )
                )

                .addTo(map);

        }
    );


    /* ========================================================
       MOUSELEAVE – AKTUELL
    ======================================================== */

    map.on(
        "mouseleave",
        "accidents-current",
        () => {

            map.getCanvas().style.cursor =
                "";

            if (hoverPopup) {

                hoverPopup.remove();

                hoverPopup = null;
            }

        }
    );


    /* ========================================================
       MOUSELEAVE – BEENDET
    ======================================================== */

    map.on(
        "mouseleave",
        "accidents-ended",
        () => {

            map.getCanvas().style.cursor =
                "";

            if (hoverPopup) {

                hoverPopup.remove();

                hoverPopup = null;
            }

        }
    );

}


/* ============================================================
   Daten laden
============================================================ */

async function loadAccidents(
    mode
) {

    currentMode =
        mode;


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Lade Unfalldaten …";


    try {

        const response =
            await fetch(

                `${API_URL}?mode=${encodeURIComponent(mode)}`,

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        /* ----------------------------------------------------
           Verschiedene mögliche API-Formate
        ---------------------------------------------------- */

        if (
            Array.isArray(data)
        ) {

            accidents =
                data;

        }

        else if (
            data &&
            Array.isArray(
                data.accidents
            )
        ) {

            accidents =
                data.accidents;

        }

        else if (
            data &&
            Array.isArray(
                data.data
            )
        ) {

            accidents =
                data.data;

        }

        else {

            console.error(
                "Unbekanntes API-Format:",
                data
            );

            accidents = [];

        }


        /* ----------------------------------------------------
           Karte aktualisieren
        ---------------------------------------------------- */

        updateMap();


        const validCount =
            accidentsToGeoJSON(
                accidents
            ).features.length;


        if (
            mode === "current"
        ) {

            status.textContent =
                `${validCount} aktuelle Meldungen`;

        }

        else {

            status.textContent =
                `${validCount} Meldungen der letzten 24 Stunden`;

        }


    }

    catch (error) {

        console.error(
            "Fehler beim Laden der Unfalldaten:",
            error
        );


        status.textContent =
            "Fehler beim Laden der Unfalldaten";

    }

}


/* ============================================================
   Buttons
============================================================ */

document
    .getElementById(
        "btnCurrent"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "btnCurrent"
                )
                .classList.add(
                    "active"
                );


            document
                .getElementById(
                    "btn24h"
                )
                .classList.remove(
                    "active"
                );


            loadAccidents(
                "current"
            );

        }
    );


document
    .getElementById(
        "btn24h"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "btn24h"
                )
                .classList.add(
                    "active"
                );


            document
                .getElementById(
                    "btnCurrent"
                )
                .classList.remove(
                    "active"
                );


            loadAccidents(
                "24h"
            );

        }
    );


/* ============================================================
   Kartenstart
============================================================ */

map.on(
    "load",
    async () => {

        try {

            await addAccidentIcons();

            await loadAccidents(
                "current"
            );

        }

        catch (error) {

            console.error(
                "Initialisierungsfehler:",
                error
            );

        }

    }
);


/* ============================================================
   Automatische Aktualisierung
============================================================ */

setInterval(
    () => {

        loadAccidents(
            currentMode
        );

    },
    5 * 60 * 1000
);


</script>

</body>
</html>
