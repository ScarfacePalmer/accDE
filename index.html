<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unfallkarte Deutschland</title>

    <link
        href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ----------------------------------------------------
           Steuerung
        ---------------------------------------------------- */

        #controls {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;

            display: flex;
            gap: 6px;

            background: rgba(255,255,255,0.96);
            padding: 6px;
            border-radius: 8px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        #controls button {
            border: none;
            border-radius: 6px;
            padding: 8px 13px;

            background: #eeeeee;
            color: #222;

            font-size: 14px;
            cursor: pointer;
        }

        #controls button:hover {
            background: #dddddd;
        }

        #controls button.active {
            background: #333;
            color: white;
        }

        /* ----------------------------------------------------
           Status
        ---------------------------------------------------- */

        #status {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 10;

            background: rgba(255,255,255,0.94);
            padding: 7px 10px;

            border-radius: 6px;

            font-size: 13px;

            box-shadow: 0 1px 5px rgba(0,0,0,0.2);
        }

        /* ----------------------------------------------------
           Popup
        ---------------------------------------------------- */

        .popup {
            min-width: 230px;
            font-size: 13px;
            line-height: 1.45;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .popup-row {
            margin: 3px 0;
        }

        .popup-label {
            font-weight: bold;
        }

        .current-title {
            color: #168a35;
        }

        .ended-title {
            color: #d43b32;
        }

        /* ----------------------------------------------------
           Legende
        ---------------------------------------------------- */

        #legend {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;

            background: rgba(255,255,255,0.95);
            padding: 8px 11px;

            border-radius: 7px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.22);

            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }

        .legend-symbol {
            width: 24px;
            text-align: center;
            font-size: 19px;
            margin-right: 5px;
        }

        .legend-current {
            color: #168a35;
        }

        .legend-ended {
            color: #d43b32;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="controls">
    <button id="btnCurrent" class="active">
        Aktuell
    </button>

    <button id="btn24h">
        Letzte 24 Stunden
    </button>
</div>

<div id="legend">
    <div class="legend-item">
        <span class="legend-symbol legend-current">⚠</span>
        Aktuelle Meldung
    </div>

    <div class="legend-item">
        <span class="legend-symbol legend-ended">⚠</span>
        Beendete Meldung
    </div>
</div>

<div id="status">
    Lade Unfalldaten …
</div>


<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

<script>

const API_URL =
    "https://accde-api.r73d.workers.dev/api/accidents";


/* ============================================================
   Karte
============================================================ */

const map = new maplibregl.Map({
    container: "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center: [10.45, 51.2],

    zoom: 5.5,

    attributionControl: true
});


map.addControl(
    new maplibregl.NavigationControl(),
    "top-right"
);


/* ============================================================
   Globale Daten
============================================================ */

let accidents = [];

let currentMode = "current";


/* ============================================================
   Hilfsfunktionen
============================================================ */

function getValue(obj, names, fallback = null) {

    for (const name of names) {

        if (
            obj[name] !== undefined &&
            obj[name] !== null &&
            obj[name] !== ""
        ) {
            return obj[name];
        }
    }

    return fallback;
}


function toNumber(value) {

    if (value === null || value === undefined) {
        return null;
    }

    const n = Number(value);

    return Number.isFinite(n) ? n : null;
}


function formatDate(value) {

    if (!value) {
        return "unbekannt";
    }

    const d = new Date(value);

    if (isNaN(d.getTime())) {
        return String(value);
    }

    return d.toLocaleString(
        "de-DE",
        {
            dateStyle: "short",
            timeStyle: "medium"
        }
    );
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   Daten in GeoJSON umwandeln
============================================================ */

function accidentsToGeoJSON(data) {

    const features = [];

    for (const accident of data) {

        const latitude = toNumber(
            getValue(accident, [
                "latitude",
                "lat",
                "Latitude",
                "LAT"
            ])
        );

        const longitude = toNumber(
            getValue(accident, [
                "longitude",
                "lon",
                "lng",
                "Longitude",
                "LON"
            ])
        );

        /*
         * Datensätze ohne gültige Koordinaten ignorieren.
         * Dadurch entsteht kein "Expected value ... null"-Fehler.
         */

        if (
            latitude === null ||
            longitude === null
        ) {
            continue;
        }

        if (
            latitude < 45 ||
            latitude > 56 ||
            longitude < 5 ||
            longitude > 16
        ) {
            continue;
        }


        const city = getValue(
            accident,
            ["city", "ort", "location", "place"],
            "Unbekannter Ort"
        );

        const street = getValue(
            accident,
            ["street", "strasse", "road"],
            "Unbekannte Straße"
        );


        const reliability = getValue(
            accident,
            [
                "reliability",
                "zuverlaessigkeit",
                "zuverlässigkeit"
            ],
            null
        );


        const reported = getValue(
            accident,
            [
                "reported_at",
                "report_time",
                "reported",
                "meldung",
                "timestamp",
                "created_at",
                "createdAt"
            ],
            null
        );


        const confirmed = getValue(
            accident,
            [
                "confirmed_at",
                "confirmation_time",
                "confirmed",
                "bestaetigt",
                "bestätigt"
            ],
            null
        );


        const start = getValue(
            accident,
            [
                "start_time",
                "started_at",
                "begin",
                "begonnen",
                "first_seen"
            ],
            reported
        );


        const end = getValue(
            accident,
            [
                "end_time",
                "ended_at",
                "end",
                "beendet",
                "last_seen"
            ],
            null
        );


        const id = getValue(
            accident,
            [
                "id",
                "uuid",
                "accident_id"
            ],
            `${latitude}_${longitude}_${reported}`
        );


        /*
         * Für die 24h-Ansicht bestimmen wir, ob die Meldung
         * beendet wurde.
         */

        const ended =
            end !== null &&
            end !== "";


        features.push({

            type: "Feature",

            id: String(id),

            geometry: {

                type: "Point",

                /*
                 * WICHTIG:
                 *
                 * GeoJSON = [longitude, latitude]
                 *
                 * Keine Pixelpositionierung.
                 * Keine translate()-Berechnung.
                 */

                coordinates: [
                    longitude,
                    latitude
                ]
            },

            properties: {

                id: String(id),

                ort: city,

                strasse: street,

                latitude: latitude,

                longitude: longitude,

                reliability: reliability,

                reported: reported,

                confirmed: confirmed,

                start: start,

                end: end,

                ended: ended
            }
        });
    }


    return {

        type: "FeatureCollection",

        features: features
    };
}


/* ============================================================
   Popup erzeugen
============================================================ */

function createPopup(properties) {

    const ended =
        properties.ended === true ||
        properties.ended === "true";


    let html = '<div class="popup">';


    if (!ended) {

        html += `
            <div class="popup-title current-title">
                ⚠ Aktuelle Meldung
            </div>

            <div class="popup-row">
                <span class="popup-label">Ort:</span>
                ${escapeHtml(properties.ort)}
            </div>

            <div class="popup-row">
                <span class="popup-label">Straße:</span>
                ${escapeHtml(properties.strasse)}
            </div>
        `;


        if (properties.reliability !== null) {

            html += `
                <div class="popup-row">
                    <span class="popup-label">
                        Zuverlässigkeit:
                    </span>
                    ${escapeHtml(properties.reliability)}
                </div>
            `;
        }


        html += `
            <div class="popup-row">
                <span class="popup-label">
                    Meldung:
                </span>
                ${escapeHtml(
                    formatDate(properties.reported)
                )}
            </div>
        `;


        if (properties.confirmed) {

            html += `
                <div class="popup-row">
                    <span class="popup-label">
                        Bestätigt:
                    </span>
                    ${escapeHtml(
                        formatDate(properties.confirmed)
                    )}
                </div>
            `;
        }

    } else {

        /*
         * Bei beendeten Meldungen:
         * Anfang / Ende statt Zuverlässigkeit / Bestätigung
         */

        html += `
            <div class="popup-title ended-title">
                ⚠ Beendete Meldung
            </div>

            <div class="popup-row">
                <span class="popup-label">Ort:</span>
                ${escapeHtml(properties.ort)}
            </div>

            <div class="popup-row">
                <span class="popup-label">Straße:</span>
                ${escapeHtml(properties.strasse)}
            </div>

            <div class="popup-row">
                <span class="popup-label">
                    Anfang:
                </span>
                ${escapeHtml(
                    formatDate(properties.start)
                )}
            </div>

            <div class="popup-row">
                <span class="popup-label">
                    Ende:
                </span>
                ${escapeHtml(
                    formatDate(properties.end)
                )}
            </div>
        `;
    }


    html += "</div>";

    return html;
}


/* ============================================================
   Map-Layer
============================================================ */

function updateMap() {

    const geojson =
        accidentsToGeoJSON(accidents);


    /*
     * Falls die Quelle schon existiert:
     * nur die Daten austauschen.
     *
     * Dadurch bleibt der MapLibre-Layer erhalten.
     */

    if (map.getSource("accidents")) {

        map
            .getSource("accidents")
            .setData(geojson);

        return;
    }


    /* --------------------------------------------------------
       GeoJSON Source
    -------------------------------------------------------- */

    map.addSource(
        "accidents",
        {
            type: "geojson",

            data: geojson
        }
    );


    /* --------------------------------------------------------
       Aktuelle Meldungen
    -------------------------------------------------------- */

    map.addLayer({

        id: "accidents-current",

        type: "symbol",

        source: "accidents",

        filter: [
            "==",
            ["get", "ended"],
            false
        ],

        layout: {

            /*
             * ⚠ wird direkt vom Kartenrenderer
             * geographisch positioniert.
             */

            "text-field": "⚠",

            "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],

                4, 22,

                7, 27,

                10, 32,

                14, 38
            ],

            "text-anchor": "center",

            "text-allow-overlap": true,

            "text-ignore-placement": true
        },

        paint: {

            "text-color": "#168a35",

            "text-halo-color": "#ffffff",

            "text-halo-width": 2,

            "text-halo-blur": 0.3
        }
    });


    /* --------------------------------------------------------
       Beendete Meldungen
    -------------------------------------------------------- */

    map.addLayer({

        id: "accidents-ended",

        type: "symbol",

        source: "accidents",

        filter: [
            "==",
            ["get", "ended"],
            true
        ],

        layout: {

            "text-field": "⚠",

            "text-size": [
                "interpolate",
                ["linear"],
                ["zoom"],

                4, 22,

                7, 27,

                10, 32,

                14, 38
            ],

            "text-anchor": "center",

            "text-allow-overlap": true,

            "text-ignore-placement": true
        },

        paint: {

            "text-color": "#d43b32",

            "text-halo-color": "#ffffff",

            "text-halo-width": 2,

            "text-halo-blur": 0.3
        }
    });


    /* --------------------------------------------------------
       Klick / Popup
    -------------------------------------------------------- */

    function showPopup(event) {

        const feature =
            event.features &&
            event.features[0];

        if (!feature) {
            return;
        }


        const coordinates =
            feature.geometry.coordinates.slice();


        /*
         * Popup bekommt die geografischen Koordinaten
         * direkt aus dem GeoJSON-Feature.
         */

        new maplibregl.Popup({

            closeButton: true,

            closeOnClick: true,

            maxWidth: "320px"
        })

        .setLngLat(coordinates)

        .setHTML(
            createPopup(feature.properties)
        )

        .addTo(map);
    }


    map.on(
        "click",
        "accidents-current",
        showPopup
    );


    map.on(
        "click",
        "accidents-ended",
        showPopup
    );


    /* --------------------------------------------------------
       Cursor
    -------------------------------------------------------- */

    map.on(
        "mouseenter",
        "accidents-current",
        () => {
            map.getCanvas().style.cursor = "pointer";
        }
    );


    map.on(
        "mouseenter",
        "accidents-ended",
        () => {
            map.getCanvas().style.cursor = "pointer";
        }
    );


    map.on(
        "mouseleave",
        "accidents-current",
        () => {
            map.getCanvas().style.cursor = "";
        }
    );


    map.on(
        "mouseleave",
        "accidents-ended",
        () => {
            map.getCanvas().style.cursor = "";
        }
    );
}


/* ============================================================
   Daten laden
============================================================ */

async function loadAccidents(mode) {

    currentMode = mode;


    const status =
        document.getElementById("status");


    status.textContent =
        "Lade Unfalldaten …";


    try {

        const response =
            await fetch(
                `${API_URL}?mode=${encodeURIComponent(mode)}`,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        /*
         * API kann entweder direkt ein Array liefern
         * oder { accidents: [...] }
         */

        if (Array.isArray(data)) {

            accidents = data;

        } else if (
            data &&
            Array.isArray(data.accidents)
        ) {

            accidents = data.accidents;

        } else if (
            data &&
            Array.isArray(data.data)
        ) {

            accidents = data.data;

        } else {

            console.error(
                "Unbekanntes API-Format:",
                data
            );

            accidents = [];
        }


        updateMap();


        const validCount =
            accidentsToGeoJSON(accidents)
                .features.length;


        if (mode === "current") {

            status.textContent =
                `${validCount} aktuelle Meldungen`;

        } else {

            status.textContent =
                `${validCount} Meldungen der letzten 24 Stunden`;
        }


    } catch (error) {

        console.error(
            "Fehler beim Laden der Unfalldaten:",
            error
        );


        status.textContent =
            "Fehler beim Laden der Unfalldaten";
    }
}


/* ============================================================
   Buttons
============================================================ */

document
    .getElementById("btnCurrent")
    .addEventListener("click", () => {

        document
            .getElementById("btnCurrent")
            .classList.add("active");

        document
            .getElementById("btn24h")
            .classList.remove("active");

        loadAccidents("current");
    });


document
    .getElementById("btn24h")
    .addEventListener("click", () => {

        document
            .getElementById("btn24h")
            .classList.add("active");

        document
            .getElementById("btnCurrent")
            .classList.remove("active");

        loadAccidents("24h");
    });


/* ============================================================
   Initialisierung
============================================================ */

map.on("load", () => {

    loadAccidents("current");

});


/* ============================================================
   Automatische Aktualisierung
============================================================ */

setInterval(() => {

    loadAccidents(currentMode);

}, 5 * 60 * 1000);

</script>

</body>
</html>
